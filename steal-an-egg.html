function drawGuardian(g){
  var b = BIOMES[g.b];
  var chasing = g.state === 'chase' && g.wake <= 0;
  var bob = Math.sin(g.bob) * 3;
  ctx.save();
  ctx.translate(g.x, g.y + bob);

  ctx.fillStyle = 'rgba(0,0,0,.25)';
  ell(0, 20, 20, 7); ctx.fill();

  if (chasing){
    var pr = 0.55 + 0.45 * Math.sin(G.t * 9);
    var rg = ctx.createRadialGradient(0, 0, 6, 0, 0, 58);
    rg.addColorStop(0, 'rgba(255,60,60,' + (0.45 * pr) + ')');
    rg.addColorStop(0.6, 'rgba(255,60,60,' + (0.18 * pr) + ')');
    rg.addColorStop(1, 'rgba(255,60,60,0)');
    ctx.fillStyle = rg;
    circle(0, 0, 58); ctx.fill();
    ctx.strokeStyle = 'rgba(255,90,90,' + (0.55 + 0.4 * pr) + ')';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(0, 0, 32 + pr * 6, 0, TAU); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,150,150,' + (0.35 * pr) + ')';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, 0, 40 + pr * 8, 0, TAU); ctx.stroke();
    /* speed lines */
    ctx.strokeStyle = 'rgba(255,150,150,.35)';
    for (var i = 0; i < 3; i++){
      var yy = -10 + i * 12;
      ctx.beginPath();
      ctx.moveTo(-g.face * 26, yy);
      ctx.lineTo(-g.face * (46 + i * 6), yy);
      ctx.stroke();
    }
  }

  if (g.stun > 0){
    ctx.save();
    for (var s = 0; s < 3; s++){
      var a = G.t * 4 + s * TAU / 3;
      ctx.fillStyle = 'rgba(255,230,120,.95)';
      circle(Math.cos(a) * 24, -26 + Math.sin(a) * 8, 3); ctx.fill();
    }
    ctx.restore();
  }

  ctx.save();
  ctx.scale(g.face < 0 ? -1 : 1, 1);
  ctx.font = '900 44px -apple-system,"Apple Color Emoji","Segoe UI Emoji",sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffffff';
  ctx.fillText(b.gEmo, 0, 0);
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left';
  ctx.restore();

  /* alert bubble */
  if (g.state === 'chase' && g.wake > 0){
    var sc = 1 + (0.5 - g.wake) * 1.4;
    ctx.save();
    ctx.scale(sc, sc);
    ctx.fillStyle = '#ff4d5e';
    rr(-11, -62, 22, 24, 8); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-4, -38); ctx.lineTo(2, -30); ctx.lineTo(6, -38);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.font = '900 18px -apple-system,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('!', 0, -44);
    ctx.textAlign = 'left';
    ctx.restore();
  } else if (g.state === 'chase'){
    label(b.gName, 0, -42, 13, '#ff9b9b');
  }

  ctx.restore();
}

function drawPlayer(){
  var p = G.player;
  var bob = p.bob || 0;
  var carry = p.carry;
  ctx.save();
  ctx.translate(p.x, p.y + bob);

  ctx.fillStyle = 'rgba(0,0,0,.25)';
  ell(0, 16 - bob, 15, 5.6); ctx.fill();

  /* feet */
  var step = Math.sin(p.anim * 2) * 3;
  ctx.fillStyle = '#c85e7e';
  ell(-6, 12, 5.4, 3.6); ctx.fill();
  ell(6, 12, 5.4, 3.6); ctx.fill();

  /* body */
  var bg = ctx.createRadialGradient(-5, -6, 2, 0, 0, 20);
  bg.addColorStop(0, '#ffc2d6');
  bg.addColorStop(1, '#ff7fa6');
  ctx.fillStyle = bg;
  circle(0, 0, 15.5); ctx.fill();
  ctx.strokeStyle = 'rgba(180,60,100,.5)';
  ctx.lineWidth = 1.6;
  circle(0, 0, 15.5); ctx.stroke();

  /* belly */
  ctx.fillStyle = 'rgba(255,236,244,.9)';
  ell(0, 5, 9.5, 8); ctx.fill();

  /* ears */
  ctx.fillStyle = '#ff9cbb';
  ell(-13, -8, 4.4, 6, -0.5); ctx.fill();
  ell(13, -8, 4.4, 6, 0.5); ctx.fill();

  /* eyes */
  var look = (p.face || 1) * 1.6;
  ctx.fillStyle = '#2a1720';
  circle(-5.2 + look, -1.6, 2.5); ctx.fill();
  circle(5.2 + look, -1.6, 2.5); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  circle(-6 + look, -2.4, 0.9); ctx.fill();
  circle(4.4 + look, -2.4, 0.9); ctx.fill();

  /* blush */
  ctx.fillStyle = 'rgba(255,120,150,.45)';
  circle(-9.5, 2.2, 2.6); ctx.fill();
  circle(9.5, 2.2, 2.6); ctx.fill();

  /* mouth */
  ctx.strokeStyle = 'rgba(80,30,45,.7)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(0, 2.5, 2.6, 0.15 * Math.PI, 0.85 * Math.PI);
  ctx.stroke();

  if (p.state === 'steal'){
    var c = clamp(1 - p.chan / p.chanMax, 0, 1);
    ctx.strokeStyle = 'rgba(0,0,0,.35)';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.arc(0, -2, 26, -Math.PI / 2, TAU - Math.PI / 2);
    ctx.stroke();
    ctx.strokeStyle = '#ffd35e';
    ctx.beginPath();
    ctx.arc(0, -2, 26, -Math.PI / 2, -Math.PI / 2 + TAU * c);
    ctx.stroke();
    ctx.fillStyle = '#ffe9a8';
    ctx.font = '900 12px -apple-system,"Apple SD Gothic Neo",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('쏘옥...', 0, -42);
    ctx.textAlign = 'left';
  }

  ctx.restore();

  /* carried egg above head */
  if (carry){
    ctx.save();
    ctx.translate(p.x, p.y + bob - 34);
    var wob = p.state === 'hatch' ? Math.sin(G.t * 26) * 0.16 : Math.sin(G.t * 6) * 0.06;
    ctx.rotate(wob);
    var cr = RAR[carry.r];
    ctx.shadowColor = rgba(cr.rgb, 0.9);
    ctx.shadowBlur = 10 + carry.r * 4;
    var eg = ctx.createRadialGradient(-4, -6, 1, 0, 0, 17);
    eg.addColorStop(0, '#ffffff');
    eg.addColorStop(0.5, rgba(cr.rgb, 1));
    eg.addColorStop(1, cr.dark);
    ctx.fillStyle = eg;
    ell(0, 0, 11, 14); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,.6)';
    ell(-3.6, -5.5, 2.6, 3.6, -0.4); ctx.fill();
    if (carry.m){
      ctx.strokeStyle = rgba(MUT[carry.m].rgb, 0.9);
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);
      ctx.lineDashOffset = -G.t * 20;
      ctx.beginPath();
      ctx.ellipse(0, 0, 17, 20, 0, 0, TAU);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    /* arms */
    ctx.strokeStyle = '#ff9cbb';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(-11, 15); ctx.lineTo(-8, 8);
    ctx.moveTo(11, 15); ctx.lineTo(8, 8);
    ctx.stroke();
    ctx.restore();

    /* weight tag */
    ctx.fillStyle = 'rgba(8,12,20,.6)';
    rr(p.x + 16, p.y + bob - 44, 44, 17, 8); ctx.fill();
    ctx.fillStyle = carry.w > 6 ? '#ffb3b3' : '#cfe0f5';
    ctx.font = '900 10px -apple-system,"Apple SD Gothic Neo",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(carry.w.toFixed(1) + 'kg', p.x + 38, p.y + bob - 32);
    ctx.textAlign = 'left';
  }

  /* hatch progress */
  if (p.state === 'hatch'){
    var hc = 1 - clamp(p.hatch / p.hatchMax, 0, 1);
    ctx.save();
    ctx.translate(p.x, p.y - 68);
    ctx.fillStyle = 'rgba(8,12,20,.75)';
    rr(-52, -10, 104, 20, 10); ctx.fill();
    ctx.fillStyle = '#57d76b';
    rr(-49, -7, 98 * hc, 14, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.35)';
    ctx.lineWidth = 1.5;
    rr(-52, -10, 104, 20, 10); ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = '900 11px -apple-system,"Apple SD Gothic Neo",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('부화 중... ' + Math.ceil(p.hatch * 10) / 10 + 's', 0, 4);
    ctx.textAlign = 'left';
    ctx.restore();
  }
}

function drawPointers(){
  var p = G.player;

  /* safe-zone arrow when carrying */
  if (p.carry && p.x > SAFE_X + 60){
    var dist = Math.round(p.x - SAFE_X);
    ctx.save();
    ctx.translate(p.x, p.y - 78);
    var bw = 96;
    ctx.fillStyle = 'rgba(8,14,24,.66)';
    rr(-bw / 2, -13, bw, 26, 13); ctx.fill();
    ctx.strokeStyle = 'rgba(150,255,190,.5)';
    ctx.lineWidth = 1.4;
    rr(-bw / 2, -13, bw, 26, 13); ctx.stroke();
    ctx.fillStyle = '#b6ffd1';
    ctx.font = '900 12px -apple-system,"Apple SD Gothic Neo",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('◀ 🏠 ' + dist, 0, 5);
    ctx.textAlign = 'left';
    ctx.restore();
  }

  /* nearest nest pointer */
  if (!p.carry && p.state !== 'steal'){
    var best = null, bd = 1e9;
    for (var i = 0; i < G.nests.length; i++){
      var n = G.nests[i];
      if (!n.occ) continue;
      var d = dst(p.x, p.y, n.x, n.y);
      if (d < bd){ bd = d; best = n; }
    }
    if (best && bd > 220){
      var s = w2s(best.x, best.y);
      var m = 26;
      if (s.x < m || s.x > VW - m || s.y < m + 60 || s.y > VH - m){
        var cx = clamp(s.x, m, VW - m), cy = clamp(s.y, m + 70, VH - m - 70);
        var ang = Math.atan2(s.y - cy, s.x - cx);
        ctx.save();
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        ctx.translate(cx, cy);
        ctx.rotate(ang);
        ctx.fillStyle = 'rgba(255,225,150,.9)';
        ctx.beginPath();
        ctx.moveTo(11, 0); ctx.lineTo(-7, 7); ctx.lineTo(-3, 0); ctx.lineTo(-7, -7);
        ctx.closePath(); ctx.fill();
        ctx.restore();
        ctx.save();
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        ctx.fillStyle = 'rgba(255,240,190,.95)';
        ctx.font = '900 10px -apple-system,"Apple SD Gothic Neo",sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('🥚' + Math.round(bd), cx, cy + 22);
        ctx.textAlign = 'left';
        ctx.restore();
      }
    }
  }
}

function drawEdgeArrow(wx, wy, txt, col){
  var s = w2s(wx, wy);
  if (s.x > -24 && s.x < VW + 24 && s.y > -24 && s.y < VH + 24) return;
  var cx = clamp(s.x, 30, VW - 30), cy = clamp(s.y, 92, VH - 100);
  var ang = Math.atan2(s.y - cy, s.x - cx);
  ctx.save();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.translate(cx, cy);
  ctx.rotate(ang);
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(10, 0); ctx.lineTo(-6, 6); ctx.lineTo(-2, 0); ctx.lineTo(-6, -6);
  ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = col;
  ctx.font = '900 10px -apple-system,"Apple SD Gothic Neo",sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(txt, cx, cy + 21);
  ctx.textAlign = 'left';
  ctx.restore();
}

   ========================================================= */
function drawScreenFX(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  /* vignette */
  var vg = ctx.createRadialGradient(VW / 2, VH / 2, Math.min(VW, VH) * 0.35, VW / 2, VH / 2, Math.max(VW, VH) * 0.78);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,.5)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, VW, VH);

  /* chase warning */
  var chasing = false;
  for (var i = 0; i < G.guardians.length; i++){
    var g = G.guardians[i];
    if (g.state === 'chase' && g.wake <= 0){ chasing = true; break; }
  }
  if (chasing){
    var a = 0.10 + 0.10 * Math.abs(Math.sin(G.t * 5));
    var rg = ctx.createRadialGradient(VW / 2, VH / 2, Math.min(VW, VH) * 0.28, VW / 2, VH / 2, Math.max(VW, VH) * 0.72);
    rg.addColorStop(0, 'rgba(255,0,0,0)');
    rg.addColorStop(1, 'rgba(255,20,20,' + a + ')');
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, VW, VH);
  }

  /* biome banner */
  if (G.banner && G.banner.t > 0){
    var b = G.banner;
    var t = b.t / b.max;
    var al = t > 0.8 ? (1 - t) / 0.2 : Math.min(1, t / 0.25);
    al = clamp(al, 0, 1);
    ctx.save();
    ctx.globalAlpha = al;
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(6,10,18,.55)';
    rr(VW / 2 - 130, VH * 0.26 - 34, 260, 74, 18); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = '900 26px -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif';
    ctx.fillText(b.emo + ' ' + b.name, VW / 2, VH * 0.26 + 2);
    ctx.fillStyle = b.col;
    ctx.font = '900 12px -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif';
    ctx.fillText(b.sub, VW / 2, VH * 0.26 + 26);
    ctx.textAlign = 'left';
    ctx.restore();
  }
}

/* =========================================================
   19. HUD
   ========================================================= */
var hudCache = { money:'', inc:'', sp:'', req:'', trap:'', label:'', emo:'', mood:'' };
function upd(id, txt){
  var el = document.getElementById(id);
  if (el && el.textContent !== txt) el.textContent = txt;
}
function updateHUD(){
  var inc = incomePerSec();
  var moneyTxt = '$' + fmt(state.money);
  if (hudCache.money !== moneyTxt){ hudCache.money = moneyTxt; upd('moneyTxt', moneyTxt); }
  var incTxt = '+$' + fmt1(inc) + '/s';
  if (hudCache.inc !== incTxt){ hudCache.inc = incTxt; upd('incomeTxt', incTxt); }

  var spTxt = fmt1(state.speed);
  if (hudCache.sp !== spTxt){ hudCache.sp = spTxt; upd('speedNum', spTxt); }

  var bIdx = biomeAt(G.player.x);
  var need = bIdx >= 0 ? BIOMES[bIdx].req : 0;
  var reqTxt = bIdx >= 0 ? ('/ 필요 ' + need) : '스피드';
  if (hudCache.req !== reqTxt){ hudCache.req = reqTxt; upd('reqTxt', reqTxt); }
  var pill = document.getElementById('speedPill');
  if (pill && pill.classList){
    if (bIdx >= 0 && state.speed < need) pill.classList.add('warn');
    else pill.classList.remove('warn');
  }

  var trapTxt = String(state.traps);
  if (hudCache.trap !== trapTxt){ hudCache.trap = trapTxt; upd('trapNum', trapTxt); }
  var tb = document.getElementById('btnTrap');
  if (tb && tb.classList){
    if (state.traps <= 0) tb.classList.add('dim'); else tb.classList.remove('dim');
  }

  /* time of day */
  var ph = DAY.phase();
  if (hudCache.tod !== ph.id){
    hudCache.tod = ph.id;
    var tp = document.getElementById('todPill');
    if (tp && tp.classList) tp.className = 'pill tod-' + ph.id;
    upd('todEmo', ph.emo);
    upd('todTxt', ph.name);
  }

  /* turkey event chip */
  var evTxt, evHot;
  if (TK.active){ evTxt = '킹 고블 ' + Math.max(0, Math.ceil(TK.t)) + 's'; evHot = true; }
  else { evTxt = '다음 ' + Math.max(0, Math.ceil(TK.next)) + 's'; evHot = TK.next < 25; }
  if (hudCache.evt !== evTxt){ hudCache.evt = evTxt; upd('eventTxt', evTxt); }
  if (hudCache.evHot !== evHot){
    hudCache.evHot = evHot;
    var eb = document.getElementById('btnEvent');
    if (eb && eb.classList){ if (evHot) eb.classList.add('hot'); else eb.classList.remove('hot'); }
  }

  /* feathers */
  var fTxt = fmt(state.feathers);
  if (hudCache.fth !== fTxt){
    hudCache.fth = fTxt;
    upd('featherTxt', fTxt);
    var fb = document.getElementById('btnFeather');
    if (fb && fb.classList){ if (state.feathers > 0) fb.classList.remove('dim'); else fb.classList.add('dim'); }
  }

  /* main button */
  var emo = '🥚', label = '훔치기', mode = '';
  var p = G.player;
  if (p.state === 'steal'){ emo = '✋'; label = '훔치는 중'; mode = 'dim'; }
  else if (p.state === 'hatch'){ emo = '🐣'; label = '부화 중'; mode = 'hatch'; }
  else if (TK.active && tkTarget()){ emo = '🦃'; label = '공격!'; mode = 'ready'; }
  else if (p.carry){
    if (inSafe()){ emo = '🐣'; label = '부화하기'; mode = 'hatch ready'; }
    else { emo = '🏃'; label = '도망!'; mode = 'dim'; }
  } else if (onTreadmill()){ emo = '⚡'; label = '훈련 중'; mode = 'dim'; }
  else if (nearestNest(74)){ emo = '🥚'; label = '훔치기!'; mode = 'ready'; }
  else { emo = '🥚'; label = '훔치기'; mode = 'dim'; }

  if (hudCache.emo !== emo){ hudCache.emo = emo; upd('mainEmo', emo); }
  if (hudCache.label !== label){ hudCache.label = label; upd('mainLab', label); }
  if (hudCache.mood !== mode){
    hudCache.mood = mode;
    var mb = document.getElementById('btnMain');
    if (mb && mb.classList){
      mb.classList.remove('ready', 'dim', 'hatch');
      if (mode) mb.classList.add(mode === 'hatch ready' ? 'hatch' : mode);
      if (mode.indexOf('ready') >= 0) mb.classList.add('ready');
    }
  }
}

function draw(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, VW, VH);
  ctx.fillStyle = '#080d19';
  ctx.fillRect(0, 0, VW, VH);

  var ox = 0, oy = 0;
  if (G.shake > 0){
    ox = rnd(-1, 1) * G.shake * 12;
    oy = rnd(-1, 1) * G.shake * 12;
  }
  ctx.setTransform(DPR * G.zoom, 0, 0, DPR * G.zoom,
    DPR * (VW / 2 - G.cam.x * G.zoom + ox), DPR * (VH / 2 - G.cam.y * G.zoom + oy));
  drawWorld();

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawScreenFX();
}

/* delegated modal clicks */
(function(){
  var body = document.getElementById('modalBody');
  body.addEventListener('click', function(e){
    var t = e.target;
    var el = (t && t.closest) ? t.closest('[data-act]') : null;
    if (!el) return;
    var act = el.getAttribute('data-act');
    if (act === 'buy'){
      buyUpgrade(el.getAttribute('data-k'));
    } else if (act === 'pick'){
      var i = parseInt(el.getAttribute('data-i'), 10);
      var at = ui.fuseSel.indexOf(i);
      if (at >= 0) ui.fuseSel.splice(at, 1);
      else if (ui.fuseSel.length < 3) ui.fuseSel.push(i);
      else { SFX.no(); return; }
      SFX.click();
      renderFuse();
    } else if (act === 'fuse'){
      if (ui.fuseSel.length === 3) doFuse(ui.fuseSel.slice());
    } else if (act === 'mute'){
      toggleMute();
      renderSet();
    } else if (act === 'reset'){
      if (!ui.confirmReset){ ui.confirmReset = true; SFX.no(); renderSet(); }
      else resetGame();
    } else if (act === 'tstart'){
      if (startTurkeyEvent()) renderTurkey();
    } else if (act === 'tbuy'){
      tkBuy(el.getAttribute('data-k'));
    } else if (act === 'topen'){
      openModal('turkey');
    }
  });
})();

function buyUpgrade(k){
  var u = UPG[k];
  if (!u) return;
  var lv = u.lv(), cost = upgCost(k);
  if (lv >= u.max){ SFX.no(); return; }
  if (state.money < cost){ toast('돈이 부족해요! 💰', 'bad'); SFX.no(); return; }
  state.money -= cost;
  state.upg[k] = lv + 1;
  SFX.buy();
  if (k === 'traps' && state.traps < trapCap()) state.traps++;
  toast('✅ ' + u.n + ' Lv.' + state.upg[k] + ' 달성!', 'good');
  renderShop();
  saveNow();
}

function resetGame(){
  try { window.localStorage.removeItem(SAVE_KEY); } catch(e){}
  var keepMute = state.muted;
  state = freshState();
  state.muted = keepMute;
  G.player.carry = null; G.player.state = 'idle'; G.player.x = 500; G.player.y = 525;
  G.player.vx = 0; G.player.vy = 0;
  G.traps = []; G.parts = []; G.floats = []; G.drops = [];
  G.cam.x = 500; G.cam.y = 525;
  G.lastBiome = -1; G.idleT = 0;
  endTurkeyEvent(true);
  TK.next = TKD.NEXT0;
  G.divineT = 16;
  DAY.t = 0.02;
  buildWorld();
  closeModal();
  hudCache = { money:'', inc:'', sp:'', req:'', trap:'', label:'', emo:'', mood:'', tod:'', evt:'', evHot:null, fth:'' };
  toast('🔄 처음부터 다시 시작합니다', 'good');
  saveNow();
}

var revealQ = [], revealing = false;
function showReveal(pet, isNew){
  revealQ.push({ pet:pet, isNew:isNew });

}
function pumpReveal(){
  if (revealing || !revealQ.length) return;
  var item = revealQ.shift();
  var pet = item.pet, r = RAR[pet.r], mut = MUT[pet.m];
  revealing = true;
  ui.open = true;

  var card = document.getElementById('revealCard');
  var col = mut.rgb || r.rgb;
  card.style.setProperty('--rc', rgba(col, 0.55));
  card.style.setProperty('--rcbg', rgba(col, 0.28));
  document.getElementById('revealEmo').textContent = pet.e;
  document.getElementById('revealName').textContent = pet.nm ? pet.nm : (r.n + ' 펫');
  document.getElementById('revealName').style.color = rgba(r.rgb, 1);
  var mutEl = document.getElementById('revealMut');
  if (pet.m){
    mutEl.textContent = mut.emo + ' ' + mut.n + ' 돌연변이';
    mutEl.style.color = rgba(mut.rgb, 1);
  } else {
    mutEl.textContent = '';
  }
  document.getElementById('revealMeta').textContent = (pet.nm ? r.n + ' · ' : '') + '무게 ' + pet.w.toFixed(1) + 'kg · 수입 +$' + fmt1(pet.inc) + '/s';
  document.getElementById('revealInc').textContent = '총 수입 +$' + fmt1(incomePerSec()) + '/s';
  var badge = document.getElementById('revealBadge');
  if (item.isNew) badge.classList.remove('hidden'); else badge.classList.add('hidden');
  document.getElementById('reveal').classList.remove('hidden');
  SFX.click();
}
function closeReveal(){
  document.getElementById('reveal').classList.add('hidden');
  revealing = false;
  ui.open = false;
  if (revealQ.length) pumpReveal();
  else updateHUD();
}

/* =========================================================
   22. Loop / init
   ========================================================= */
var lastTs = 0;
function frame(ts){
  requestAnimationFrame(frame);
  if (!lastTs) lastTs = ts;
  var dt = (ts - lastTs) / 1000;
  lastTs = ts;
  if (!isFinite(dt) || dt < 0) dt = 0;
  dt = Math.min(dt, 0.05);

  if (G.started){
    update(dt);
  } else {
    G.t += dt;
    DAY.advance(dt);
    updateFX(dt);
    updateCamera(dt);
    updateToasts(dt);
  }
  draw();
}

function bindUI(){
  var mb = document.getElementById('btnMain');
  if (mb) mb.addEventListener('click', function(){ if (G.started) { audioInit(); doAction(); } });
  var tb = document.getElementById('btnTrap');
  if (tb) tb.addEventListener('click', function(){ if (G.started) { audioInit(); placeTrap(); } });
  var bd = document.getElementById('btnDex');
  if (bd) bd.addEventListener('click', function(){ if (G.started) openModal('dex'); });
  var bs = document.getElementById('btnShop');
  if (bs) bs.addEventListener('click', function(){ if (G.started) openModal('shop'); });
  var bf = document.getElementById('btnFuse');
  if (bf) bf.addEventListener('click', function(){ if (G.started) openModal('fuse'); });
  var bm = document.getElementById('btnMute');
  if (bm) bm.addEventListener('click', function(){ toggleMute(); });
  var be = document.getElementById('btnEvent');
  if (be) be.addEventListener('click', function(){
    if (!G.started) return;
    audioInit();
    if (TK.active) openModal('turkey');
    else startTurkeyEvent();
  });
  var bfe = document.getElementById('btnFeather');
  if (bfe) bfe.addEventListener('click', function(){ if (G.started) openModal('turkey'); });
  var bt = document.getElementById('btnSet');
  if (bt) bt.addEventListener('click', function(){ if (G.started) openModal('set'); });
  var mc = document.getElementById('modalClose');
  if (mc) mc.addEventListener('click', function(){ closeModal(); SFX.click(); });
  var ml = document.getElementById('modalLayer');
  if (ml) ml.addEventListener('click', function(e){ if (e.target === ml) closeModal(); });
  var rok = document.getElementById('revealOk');
  if (rok) rok.addEventListener('click', function(){ closeReveal(); });
  var rv = document.getElementById('reveal');
  if (rv) rv.addEventListener('click', function(e){ if (e.target === rv) closeReveal(); });
  var sb = document.getElementById('startBtn');
  if (sb) sb.addEventListener('click', startGame);
  var st = document.getElementById('start');
  if (st) st.addEventListener('click', function(e){ if (e.target === st || e.target.id === 'startInner') startGame(); });

  document.addEventListener('visibilitychange', function(){
    if (document.hidden) saveNow();
    else lastTs = 0;
  });
  window.addEventListener('pagehide', function(){ saveNow(); });
  window.addEventListener('beforeunload', function(){ saveNow(); });
  document.addEventListener('gesturestart', function(e){ if (e.preventDefault) e.preventDefault(); });
  document.addEventListener('dblclick', function(e){ if (e.preventDefault) e.preventDefault(); }, { passive:false });
  window.addEventListener('pointerdown', function(){ audioInit(); });
  window.addEventListener('touchstart', function(){ audioInit(); }, { passive:true });
  window.addEventListener('touchend', function(){ audioInit(); }, { passive:true });
  window.addEventListener('click', function(){ audioInit(); });
  window.addEventListener('keydown', function(){ audioInit(); });
}

function startGame(){
  var st = document.getElementById('start');
  if (st) st.classList.add('hidden');
  audioInit();
  SFX.click();
  G.started = true;
  state.started = true;
  lastTs = 0;
  G.cam.x = G.player.x; G.cam.y = G.player.y;
  if (state.stats.hatched === 0 && state.stats.stolen === 0){
    toast('🕹️ 왼쪽 스틱으로 이동 · 오른쪽 버튼으로 알 훔치기!', 'good');
  } else {
    toast('다시 오셨네요! 이어서 합니다 💚', 'good');
  }
  updateHUD();
  saveNow();
}

function init(){
  loadSave();
  buildWorld();
  buildRail();
  resize();
  G.cam.x = G.player.x;
  G.cam.y = G.player.y;
  G.lastBiome = biomeAt(G.player.x);
  updateMuteBtn();
  bindUI();
  updateHUD();
  var sb = document.getElementById('startBtn');
  if (sb && (state.stats.hatched > 0 || state.money > 0)) sb.textContent = '이어서 하기 ▶';
  requestAnimationFrame(frame);
}

window.__game = { G:G, get state(){ return state; }, BIOMES:BIOMES, RAR:RAR, MUT:MUT, DAY:DAY, TK:TK, TKD:TKD, TKSHOP:TKSHOP,
  doAction:doAction, placeTrap:placeTrap, openModal:openModal, closeModal:closeModal, startGame:startGame, saveNow:saveNow,
  doFuse:doFuse, buyUpgrade:buyUpgrade, startTurkeyEvent:startTurkeyEvent, tkAttack:tkAttack, tkBuy:tkBuy, renderTurkey:renderTurkey,
  closeReveal:closeReveal,
  addDrop:addDrop, capacity:capacity, incomePerSec:incomePerSec, playerSpeedNow:playerSpeedNow, TREAD:TREAD, fmt:fmt };

init();
})();
</script>
