<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#080d19">
<title>🥚 알을 훔쳐라! · 계훔</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden;background:#070b16;color:#eaf0ff;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none;
    -webkit-touch-callout:none}
  canvas#cv{position:fixed;left:0;top:0;width:100%;height:100%;display:block;z-index:0}
  button{font-family:inherit;color:inherit}
  .hidden{display:none !important}

  /* ---------- top HUD ---------- */
  #hud{position:fixed;left:0;right:0;top:0;z-index:12;pointer-events:none;
    padding:calc(6px + env(safe-area-inset-top)) 10px 0}
  #hudRow{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .pill{display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;line-height:1;
    background:linear-gradient(180deg,rgba(30,39,64,.9),rgba(12,17,30,.92));
    border:1px solid rgba(255,255,255,.13);box-shadow:0 6px 18px rgba(0,0,0,.4);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
  .pill .ic{font-size:15px}
  .pill .num{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
  .pill .sub{font-size:10px;font-weight:700;opacity:.66;letter-spacing:-.2px}
  #incomeTxt{color:#8dffb8}
  #speedNum{color:#8fe3ff}
  #speedPill.warn{border-color:rgba(255,120,120,.6);box-shadow:0 0 0 2px rgba(255,80,80,.18),0 6px 18px rgba(0,0,0,.4)}
  #speedPill.warn #speedNum{color:#ff9d9d}

  /* rail */
  #rail{position:relative;margin:7px 2px 0;height:19px;border-radius:999px;overflow:hidden;
    background:rgba(8,12,22,.62);border:1px solid rgba(255,255,255,.12);pointer-events:none}
  #railInner{display:flex;height:100%;width:100%}
  .seg{height:100%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;
    letter-spacing:-.3px;color:rgba(255,255,255,.72);border-right:1px solid rgba(0,0,0,.35);overflow:hidden;white-space:nowrap}
  .seg:last-child{border-right:0}
  .seg.on{color:#fff;text-shadow:0 0 8px rgba(255,255,255,.7)}
  .seg.on::after{content:"";position:absolute}
  #railMark{position:absolute;top:-2px;left:0;width:7px;height:23px;border-radius:4px;background:#fff;
    box-shadow:0 0 10px #fff,0 0 22px rgba(255,255,255,.6);transform:translateX(-50%);transition:left .08s linear}

  /* time of day badge */
  #todPill{gap:5px;transition:background .9s ease,border-color .9s ease,color .9s ease,box-shadow .9s ease}
  #todPill .num{font-size:11.5px;letter-spacing:-.3px}
  #todPill.tod-morning{background:linear-gradient(180deg,rgba(255,222,164,.96),rgba(226,150,80,.94));
    border-color:rgba(255,238,198,.65);color:#42200a;box-shadow:0 0 18px rgba(255,190,110,.35),0 6px 18px rgba(0,0,0,.4)}
  #todPill.tod-day{background:linear-gradient(180deg,rgba(190,232,255,.96),rgba(96,178,236,.94));
    border-color:rgba(236,250,255,.7);color:#04263a;box-shadow:0 0 18px rgba(150,215,255,.35),0 6px 18px rgba(0,0,0,.4)}
  #todPill.tod-dusk{background:linear-gradient(180deg,rgba(255,176,132,.96),rgba(186,86,108,.94));
    border-color:rgba(255,214,178,.6);color:#3d1108;box-shadow:0 0 20px rgba(255,140,90,.4),0 6px 18px rgba(0,0,0,.4)}
  #todPill.tod-night{background:linear-gradient(180deg,rgba(48,58,112,.96),rgba(14,19,44,.96));
    border-color:rgba(150,170,255,.4);color:#e2e9ff;box-shadow:0 0 20px rgba(120,150,255,.35),0 6px 18px rgba(0,0,0,.4)}
  #todPill.tod-night .num{text-shadow:0 0 10px rgba(160,185,255,.8)}

  /* menu buttons */
  #menu{display:flex;gap:5px;justify-content:space-between;align-items:center;margin-top:6px;pointer-events:auto}
  #menuLeft{display:flex;gap:5px;align-items:center;min-width:0}
  #menuRight{display:flex;gap:5px;align-items:center}
  .chipbtn{display:flex;align-items:center;gap:4px;height:29px;padding:0 9px;border-radius:10px;cursor:pointer;
    border:1px solid rgba(255,255,255,.14);background:linear-gradient(180deg,rgba(30,39,64,.92),rgba(12,17,30,.92));
    font-size:10.5px;font-weight:900;letter-spacing:-.3px;white-space:nowrap;color:#dfe8f8;
    box-shadow:0 4px 12px rgba(0,0,0,.32);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
  .chipbtn .e{font-size:13px;line-height:1}
  .chipbtn:active{transform:scale(.94)}
  .chipbtn.hot{border-color:rgba(255,178,107,.75);color:#ffe3bd;
    background:linear-gradient(180deg,rgba(126,66,24,.95),rgba(60,30,10,.95));
    box-shadow:0 0 0 2px rgba(255,150,60,.2),0 4px 14px rgba(0,0,0,.35)}
  .chipbtn.hot .e{animation:flap 1.1s ease-in-out infinite}
  @keyframes flap{0%,100%{transform:rotate(-9deg) scale(1)}50%{transform:rotate(9deg) scale(1.14)}}
  .chipbtn.dim{opacity:.52}
  .chipbtn.fth{color:#ffd9a8}
  .buy.fth{background:linear-gradient(180deg,#ffcf8e,#e08a3c);color:#3a1c00}
  .tkHp{height:7px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:5px}
  .tkHp i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#ffd35e,#ff7b4d)}
  .iconbtn{width:33px;height:33px;border-radius:11px;border:1px solid rgba(255,255,255,.13);cursor:pointer;
    background:linear-gradient(180deg,rgba(30,39,64,.92),rgba(12,17,30,.92));font-size:15px;line-height:1;
    display:flex;align-items:center;justify-content:center;position:relative;
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 4px 12px rgba(0,0,0,.35)}
  .iconbtn:active{transform:scale(.92)}
  .iconbtn .dot{position:absolute;top:-3px;right:-3px;min-width:15px;height:15px;border-radius:8px;background:#ff5b6e;
    font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 3px;color:#fff}

  /* toasts */
  #toasts{position:fixed;left:0;right:0;top:calc(110px + env(safe-area-inset-top));z-index:11;
    display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
  .toast{padding:7px 14px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:-.2px;
    background:rgba(10,15,26,.9);border:1px solid rgba(255,255,255,.16);box-shadow:0 8px 22px rgba(0,0,0,.45);
    animation:toastIn .22s ease-out both;max-width:92vw;text-align:center}
  .toast.bad{border-color:rgba(255,90,90,.55);color:#ffb3b3}
  .toast.good{border-color:rgba(120,255,170,.5);color:#b6ffd1}
  .toast.out{animation:toastOut .3s ease-in both}
  @keyframes toastIn{from{opacity:0;transform:translateY(-8px) scale(.94)}to{opacity:1;transform:none}}
  @keyframes toastOut{to{opacity:0;transform:translateY(-6px) scale(.96)}}

  /* ---------- controls ---------- */
  #joy{position:fixed;z-index:13;width:132px;height:132px;border-radius:50%;touch-action:none;
    left:calc(16px + env(safe-area-inset-left));bottom:calc(20px + env(safe-area-inset-bottom));
    background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.12),rgba(255,255,255,.03) 70%);
    border:2px solid rgba(255,255,255,.17);box-shadow:0 10px 30px rgba(0,0,0,.3) inset,0 6px 20px rgba(0,0,0,.3)}
  #joyKnob{position:absolute;left:50%;top:50%;width:58px;height:58px;border-radius:50%;margin:-29px 0 0 -29px;
    background:radial-gradient(circle at 38% 32%,#ffffff,#b8c7e2 70%,#93a4c4);box-shadow:0 6px 16px rgba(0,0,0,.45);
    transition:transform .03s linear}
  #joy .ring{position:absolute;inset:14px;border-radius:50%;border:1px dashed rgba(255,255,255,.18)}

  #actions{position:fixed;z-index:13;right:calc(14px + env(safe-area-inset-right));
    bottom:calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:flex-end;gap:10px}
  #btnMain{width:96px;height:96px;border-radius:50%;border:0;cursor:pointer;position:relative;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    background:linear-gradient(180deg,#ffd35e,#ff9e2c);color:#3a1c00;
    box-shadow:0 8px 0 #b96b00,0 14px 26px rgba(0,0,0,.4);transition:transform .06s,box-shadow .06s}
  #btnMain .big{font-size:30px;line-height:1;filter:drop-shadow(0 1px 0 rgba(255,255,255,.5))}
  #btnMain .lab{font-size:11px;font-weight:900;letter-spacing:-.4px}
  #btnMain:active{transform:translateY(4px);box-shadow:0 4px 0 #b96b00,0 8px 16px rgba(0,0,0,.4)}
  #btnMain.ready{animation:pulseBtn 1.1s ease-in-out infinite}
  #btnMain.dim{background:linear-gradient(180deg,#4b556b,#333c4f);color:#9aa7bd;box-shadow:0 8px 0 #232a38,0 12px 22px rgba(0,0,0,.35)}
  #btnMain.hatch{background:linear-gradient(180deg,#b6ff9e,#57d76b);color:#0b3a12;box-shadow:0 8px 0 #2f9c45,0 14px 26px rgba(0,0,0,.4)}
  @keyframes pulseBtn{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
  #btnTrap{width:62px;height:62px;border-radius:50%;border:1px solid rgba(255,255,255,.16);cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;
    background:linear-gradient(180deg,rgba(43,54,82,.95),rgba(20,26,42,.95));box-shadow:0 8px 18px rgba(0,0,0,.4)}
  #btnTrap .e{font-size:22px}
  #btnTrap .c{font-size:10px;font-weight:900;margin-top:2px;color:#ffd9a0}
  #btnTrap:active{transform:scale(.93)}
  #btnTrap.dim{opacity:.45}

  /* ---------- overlays ---------- */
  .overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    padding:14px;background:rgba(4,7,14,.62);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    animation:fadeIn .18s ease-out}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .card{width:100%;max-width:470px;max-height:86vh;display:flex;flex-direction:column;
    border-radius:22px;border:1px solid rgba(255,255,255,.14);
    background:linear-gradient(180deg,#1a2237,#111725 60%,#0d1220);
    box-shadow:0 24px 60px rgba(0,0,0,.6);overflow:hidden}
  .cardHead{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;border-bottom:1px solid rgba(255,255,255,.08)}
  .cardHead h2{margin:0;font-size:16px;font-weight:900;letter-spacing:-.4px;flex:1}
  .cardHead .close{width:30px;height:30px;border-radius:10px;border:0;background:rgba(255,255,255,.09);cursor:pointer;font-size:14px}
  .cardBody{padding:12px 14px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .sect{margin:2px 0 10px;font-size:10.5px;font-weight:900;letter-spacing:.4px;color:#8ea3c6;text-transform:uppercase}

  .row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:14px;margin-bottom:7px;
    background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07)}
  .row .em{font-size:22px;width:28px;text-align:center;flex:0 0 auto}
  .row .info{flex:1;min-width:0}
  .row .nm{font-size:13px;font-weight:800;display:flex;align-items:center;gap:6px}
  .row .nm .lv{font-size:10px;font-weight:900;color:#9fe0ff;background:rgba(100,200,255,.13);
    border-radius:6px;padding:1px 5px}
  .row .ds{font-size:11px;color:#96a5bf;margin-top:2px;line-height:1.35}
  .buy{border:0;border-radius:11px;padding:8px 12px;font-size:12px;font-weight:900;cursor:pointer;
    background:linear-gradient(180deg,#7fe08a,#3fae55);color:#06230d;white-space:nowrap;min-width:74px}
  .buy:active{transform:scale(.95)}
  .buy:disabled{background:#2a3244;color:#6f7b91;cursor:default;transform:none}
  .buy.max{background:#2a3244;color:#8b97ad}

  /* fuse grid */
  .petGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}
  .petCell{position:relative;aspect-ratio:1;min-height:72px;border-radius:14px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2px;cursor:pointer;overflow:hidden;
    background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.1)}
  .petCell .pe{font-size:23px;line-height:1}
  .petCell .pw{font-size:8.5px;font-weight:800;color:#a9b8d1}
  .petCell.sel{border-color:#ffd35e;box-shadow:0 0 0 2px rgba(255,211,94,.35),0 0 18px rgba(255,211,94,.25)}
  .petCell .ord{position:absolute;top:3px;right:4px;width:15px;height:15px;border-radius:8px;background:#ffd35e;
    color:#3a1c00;font-size:9px;font-weight:900;display:none;align-items:center;justify-content:center}
  .petCell.sel .ord{display:flex}
  .emptyNote{text-align:center;color:#7e8da6;font-size:12px;padding:22px 10px}
  .odds{display:flex;gap:6px;margin:8px 0 12px;flex-wrap:wrap}
  .odd{flex:1;min-width:64px;border-radius:12px;padding:7px 6px;text-align:center;background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.08)}
  .odd .v{font-size:13px;font-weight:900}
  .odd .k{font-size:9px;color:#93a2ba;margin-top:2px;font-weight:800}
  .bigbtn{width:100%;border:0;border-radius:14px;padding:13px;font-size:14px;font-weight:900;cursor:pointer;
    background:linear-gradient(180deg,#ffd35e,#ff9e2c);color:#3a1c00;box-shadow:0 6px 0 #b96b00}
  .bigbtn:active{transform:translateY(3px);box-shadow:0 3px 0 #b96b00}
  .bigbtn:disabled{background:#2a3244;color:#6f7b91;box-shadow:0 6px 0 #1b2231}
  .bigbtn.alt{background:linear-gradient(180deg,#8fd6ff,#4aa3e0);color:#062034;box-shadow:0 6px 0 #2a6d99}
  .bigbtn.danger{background:linear-gradient(180deg,#ff9b9b,#e05252);color:#2b0505;box-shadow:0 6px 0 #992e2e}

  /* dex */
  .dexGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
  .dexCell{border-radius:13px;padding:8px 4px;text-align:center;background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.07);position:relative;overflow:hidden}
  .dexCell .de{font-size:22px}
  .dexCell .dn{font-size:9px;font-weight:900;margin-top:3px}
  .dexCell .dw{font-size:8.5px;color:#93a2ba;font-weight:700}
  .dexCell.lock{opacity:.42}
  .dexCell.lock .de{filter:grayscale(1) brightness(.5)}
  .statGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:12px}
  .stat{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:8px 10px}
  .stat .k{font-size:9.5px;color:#93a2ba;font-weight:800}
  .stat .v{font-size:14px;font-weight:900;margin-top:2px}
  .help{font-size:11.5px;line-height:1.7;color:#a8b6cd}
  .help b{color:#eaf0ff}
  kbd{display:inline-block;min-width:18px;text-align:center;padding:1px 5px;border-radius:5px;font-size:10px;
    background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);font-weight:800}

  /* reveal */
  #revealCard{position:relative;width:270px;max-width:88vw;border-radius:24px;padding:22px 18px 18px;text-align:center;
    border:1px solid rgba(255,255,255,.2);box-shadow:0 0 60px var(--rc,#fff3),0 24px 60px rgba(0,0,0,.6);
    background:radial-gradient(circle at 50% 0%,var(--rcbg,#233) 0%,#111725 72%);animation:pop .32s cubic-bezier(.2,1.5,.4,1) both}
  @keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
  #revealEmo{font-size:64px;line-height:1;filter:drop-shadow(0 6px 18px var(--rc,#fff2));animation:bob 1.6s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-7px) rotate(2deg)}}
  #revealName{font-size:18px;font-weight:900;margin-top:8px;letter-spacing:-.4px}
  #revealMut{font-size:11px;font-weight:900;margin-top:3px;color:#ffd86b}
  #revealMeta{font-size:12px;font-weight:700;color:#b9c7de;margin-top:7px;line-height:1.6}
  #revealInc{font-size:15px;font-weight:900;color:#8dffb8;margin-top:6px}
  #revealBadge{display:inline-block;margin-top:9px;padding:3px 10px;border-radius:999px;font-size:10px;font-weight:900;
    background:linear-gradient(90deg,#ffd35e,#ff8fb1);color:#3a1400}
  #revealOk{margin-top:14px;width:100%;border:0;border-radius:14px;padding:11px;font-size:13px;font-weight:900;cursor:pointer;
    background:#fff;color:#111725}
  #revealOk:active{transform:scale(.97)}

  /* start */
  #start{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:18px;
    background:radial-gradient(circle at 50% 18%,#26365c 0%,#0d1322 55%,#06090f 100%)}
  #startInner{width:100%;max-width:420px;text-align:center;animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
  #startEgg{font-size:82px;line-height:1;animation:bob 2.2s ease-in-out infinite;filter:drop-shadow(0 14px 26px rgba(255,200,80,.35))}
  #startTitle{font-size:30px;font-weight:900;letter-spacing:-1.2px;margin-top:6px;
    background:linear-gradient(180deg,#fff,#ffd35e 90%);-webkit-background-clip:text;background-clip:text;color:transparent}
  #startSub{font-size:12.5px;color:#9fb0cc;margin-top:8px;line-height:1.6;font-weight:600}
  #startHow{display:flex;gap:6px;justify-content:center;margin:18px 0 6px;flex-wrap:wrap}
  .howchip{padding:7px 11px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
    font-size:10.5px;font-weight:800;color:#c9d6ea}
  #startBtn{margin-top:20px;width:100%;border:0;border-radius:18px;padding:17px;font-size:17px;font-weight:900;cursor:pointer;
    background:linear-gradient(180deg,#ffd35e,#ff9e2c);color:#3a1c00;box-shadow:0 9px 0 #b96b00,0 18px 34px rgba(255,158,44,.25);
    letter-spacing:-.4px}
  #startBtn:active{transform:translateY(5px);box-shadow:0 4px 0 #b96b00}
  #startNote{margin-top:12px;font-size:10px;color:#7284a1;font-weight:700}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud">
  <div id="hudRow">
    <div class="pill"><span class="ic">💰</span><span class="num" id="moneyTxt">$0</span><span class="sub" id="incomeTxt">+$0/s</span></div>
    <div class="pill" id="todPill"><span class="ic" id="todEmo">🌅</span><span class="num" id="todTxt">아침</span></div>
    <div class="pill" id="speedPill"><span class="ic">⚡</span><span class="num" id="speedNum">15</span><span class="sub" id="reqTxt">스피드</span></div>
  </div>
  <div id="rail"><div id="railInner"></div><div id="railMark"></div></div>
  <div id="menu">
    <div id="menuLeft">
      <button class="chipbtn" id="btnEvent"><span class="e">🦃</span><span id="eventTxt">이벤트</span></button>
      <button class="chipbtn fth dim" id="btnFeather"><span class="e">🪶</span><span id="featherTxt">0</span></button>
    </div>
    <div id="menuRight">
      <button class="iconbtn" id="btnDex" title="도감">📖</button>
      <button class="iconbtn" id="btnShop" title="상점">🛒</button>
      <button class="iconbtn" id="btnFuse" title="퓨즈">⚗️</button>
      <button class="iconbtn" id="btnMute" title="소리">🔊</button>
      <button class="iconbtn" id="btnSet" title="설정">⚙️</button>
    </div>
  </div>
</div>

<div id="toasts"></div>

<div id="joy"><div class="ring"></div><div id="joyKnob"></div></div>

<div id="actions">
  <button id="btnTrap"><span class="e">🪤</span><span class="c" id="trapNum">3</span></button>
  <button id="btnMain"><span class="big" id="mainEmo">🥚</span><span class="lab" id="mainLab">훔치기</span></button>
</div>

<div id="modalLayer" class="overlay hidden">
  <div class="card">
    <div class="cardHead"><h2 id="modalTitle"></h2><button class="close" id="modalClose">✕</button></div>
    <div class="cardBody" id="modalBody"></div>
  </div>
</div>

<div id="reveal" class="overlay hidden">
  <div id="revealCard">
    <div id="revealEmo">🐤</div>

(function(){

function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t){ return a + (b - a) * t; }
function rnd(a, b){ return a + Math.random() * (b - a); }
function rndi(a, b){ return Math.floor(a + Math.random() * (b - a + 1)); }
function pick(a){ return a[Math.floor(Math.random() * a.length)]; }
function dst(x1, y1, x2, y2){ var dx = x2 - x1, dy = y2 - y1; return Math.sqrt(dx * dx + dy * dy); }
function rgba(rgb, a){ return 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + a + ')'; }
function easeOut(t){ return 1 - Math.pow(1 - t, 3); }
function easeInOut(t){ return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
function nowMs(){
  if (typeof performance !== 'undefined' && performance.now) return performance.now();
  return Date.now();
}
function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

var SUF = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx'];
function fmt(n){
  if (!isFinite(n)) return '∞';
  if (n < 0) return '-' + fmt(-n);
  if (n < 1000) return String(Math.floor(n));
  var i = 0, v = n;
  while (v >= 1000 && i < SUF.length - 1){ v /= 1000; i++; }
  return (v < 10 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : String(Math.floor(v))) + SUF[i];
}
function fmt1(n){
  if (n < 0) return '-' + fmt1(-n);
  if (n < 100) return (Math.round(n * 10) / 10).toFixed(1).replace(/\.0$/, '');

}

    { p:0.92, v:1 },

  ],
  keys: function(arr){
    var t = this.t - Math.floor(this.t);
    for (var i = 0; i < arr.length - 1; i++){
      var a = arr[i], b = arr[i + 1];
      if (t >= a.p && t <= b.p){
        var f = (t - a.p) / Math.max(0.0001, b.p - a.p);
        return { a:a, b:b, f:f };
      }
    }
    return { a:arr[0], b:arr[arr.length - 1], f:0 };
  },
  tint: function(){
    var k = this.keys(this.tintKeys);
    var f = k.f * k.f * (3 - 2 * k.f);
    return [
      Math.round(lerp(k.a.c[0], k.b.c[0], f)),
      Math.round(lerp(k.a.c[1], k.b.c[1], f)),
      Math.round(lerp(k.a.c[2], k.b.c[2], f))
    ];
  },
  nightF: function(){
    var k = this.keys(this.nightKeys);
    var f = k.f * k.f * (3 - 2 * k.f);
    return clamp(lerp(k.a.v, k.b.v, f), 0, 1);
  },
  phase: function(){
    var t = this.t - Math.floor(this.t);
    if (t < 0.12) return { id:'morning', emo:'🌅', name:'아침' };

function saveNow(){
  try {
    var d = {
      v: 1,
      money: state.money, speed: state.speed, traps: state.traps, trapTimer: state.trapTimer,
      pets: state.pets.map(function(p){ return { r:p.r, m:p.m, w:p.w, e:p.e, inc:p.inc, x:p.x, y:p.y, nm:p.nm || null }; }),
      dex: state.dex, upg: state.upg, stats: state.stats, muted: state.muted,
      started: state.started, bestBiome: state.bestBiome,
      feathers: state.feathers, skin: state.skin, sot: DAY.t
    };
    window.localStorage.setItem(SAVE_KEY, JSON.stringify(d));

  } catch(e){ return false; }
}
function loadSave(){
  try {
    var raw = window.localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    var d = JSON.parse(raw);
    if (!d || typeof d !== 'object') return false;
    state.money = +d.money || 0;
    state.speed = +d.speed >= 1 ? +d.speed : 15;
    state.traps = d.traps === undefined ? 3 : (+d.traps || 0);
    state.trapTimer = +d.trapTimer || 0;
    state.muted = !!d.muted;
    state.started = !!d.started;
    state.bestBiome = +d.bestBiome || 0;
    state.feathers = Math.max(0, Math.floor(+d.feathers || 0));
    state.skin = (d.skin === 'turkey') ? 'turkey' : 'farm';
    if (isFinite(+d.sot)) DAY.t = clamp(+d.sot, 0, 0.999);
    if (d.upg){
      for (var k in state.upg){
        if (d.upg[k] !== undefined && isFinite(+d.upg[k])){
          state.upg[k] = clamp(Math.floor(+d.upg[k]), 1, UPG[k].max);
        }
      }
    }
    if (d.dex && typeof d.dex === 'object') state.dex = d.dex;
    if (d.stats) for (var s in state.stats){ if (isFinite(+d.stats[s])) state.stats[s] = +d.stats[s]; }
    if (d.pets && d.pets.length){
      state.pets = d.pets.filter(function(p){ return p && p.r >= 0 && p.r <= 6; }).map(function(p){
        var rr = clamp(Math.floor(+p.r), 0, 6), mm = clamp(Math.floor(+p.m || 0), 0, MUT.length - 1);
        return {
          r: rr,
          m: mm,
          w: +p.w || 1,
          e: p.e || pick(RAR[rr].emo),
          inc: +p.inc || petIncome(rr, mm, +p.w || 1),
          x: +p.x || 0, y: +p.y || 0,
          nm: p.nm || null
        };
      });
    }
    return true;
  } catch(e){ return false; }
}

function incomePerSec(){

function playerSpeedNow(){

/* =========================================================

   ========================================================= */
function rollRarity(b){
  var w = b.wgt, tot = 0, i;
  for (i = 0; i < w.length; i++) tot += w[i];
  var r = Math.random() * tot;
  for (i = 0; i < w.length; i++){ r -= w[i]; if (r <= 0) return i; }
  return 0;
}
function rollMut(b){
  var r = Math.random();
  if (r < b.gAlien) return 2;
  if (r < b.gAlien + b.gGold) return 1;
  return 0;
}

function buildWorld(){
  var i, j, b;
  G.nests = [];
  G.guardians = [];
  for (i = 0; i < BIOMES.length; i++){
    b = BIOMES[i];
    for (j = 0; j < 6; j++){
      var col = j % 3, row = (j / 3) | 0;
      G.nests.push({
        b: i,
        x: b.x0 + 230 + col * ((b.w - 460) / 2) + rnd(-45, 45),
        y: 286 + row * 320 + rnd(-42, 42),
        occ: true,
        r: rollRarity(b),
        m: rollMut(b),
        respawn: 0,
        ph: rnd(0, TAU),
        pop: 1
      });
    }
    G.guardians.push({
      b: i,
      x: b.x0 + b.w * 0.5,
      y: WORLD_H * 0.5,
      hx: b.x0 + b.w * 0.5,
      hy: WORLD_H * 0.5,
      state: 'patrol',
      vx: 0, vy: 0,
      face: -1,
      wake: 0,
      stun: 0,
      chaseT: 0,

      ty: WORLD_H * 0.5,
      wander: rnd(1, 4),
      bob: rnd(0, TAU),

    });

  /* seeded scenery */

  for (i = 0; i < BIOMES.length; i++){

      G.deco.push({
        b: i,
        x: b.x0 + rng() * b.w,
        y: rng() * WORLD_H,
        t: rng(),
        s: 0.55 + rng() * 0.9,
        rot: (rng() - 0.5) * 0.9,
        ph: rng() * TAU
      });
    }
  }
  G.decoPen = [];
  for (j = 0; j < 300; j++){
    G.decoPen.push({
      x: PEN_X0 + 10 + rng() * (PEN_X1 - PEN_X0 - 20),
      y: 40 + rng() * (WORLD_H - 80),
      t: rng(), s: 0.45 + rng() * 0.85, ph: rng() * TAU
    });
  }

  /* 반딧불이 (밤 전용) */

  for (j = 0; j < 78; j++){
    var fx = 60 + rng() * (WORLD_W - 140);
    G.flies.push({
      x: fx, y: 60 + rng() * (WORLD_H - 120),
      vx: rnd(-9, 9), vy: rnd(-7, 7),
      ph: rng() * TAU, sp: 0.5 + rng() * 0.9
    });

}

  VH = Math.max(320, window.innerHeight || 640);

var keys = {};
var joy = { active:false, id:null, x:0, y:0 };
var joyEl = document.getElementById('joy');
var knob = document.getElementById('joyKnob');

function inputVec(){
  var x = 0, y = 0;
  if (keys.left) x -= 1;
  if (keys.right) x += 1;
  if (keys.up) y -= 1;
  if (keys.down) y += 1;
  if (joy.active){ x += joy.x; y += joy.y; }
  var m = Math.sqrt(x * x + y * y);
  if (m > 1){ x /= m; y /= m; m = 1; }
  return { x:x, y:y, m:m };
}

function keyName(e){
  var k = e.key;
  if (!k) return '';
  if (k === 'ArrowLeft' || k === 'ArrowRight' || k === 'ArrowUp' || k === 'ArrowDown' ||
      k === ' ' || k === 'Spacebar') return k;
  return k.length === 1 ? k.toLowerCase() : k;
}

window.addEventListener('keydown', function(e){
  var k = keyName(e);
  if (k === 'ArrowLeft') keys.left = true;
  else if (k === 'ArrowRight') keys.right = true;
  else if (k === 'ArrowUp') keys.up = true;
  else if (k === 'ArrowDown') keys.down = true;
  else if (k === 'a') keys.left = true;
  else if (k === 'd') keys.right = true;
  else if (k === 'w') keys.up = true;
  else if (k === 's') keys.down = true;
  else if (k === 'e' || k === ' ' || k === 'Spacebar' || k === 'Enter'){
    if (!ui.open && G.started){ e.preventDefault(); doAction(); }
  }
  else if (k === 'q'){ if (!ui.open && G.started) placeTrap(); }
  else if (k === 'Escape'){ if (ui.open) closeModal(); }
  else if (k === 'm'){ toggleMute(); }
  else if (k === 'i'){ if (G.started) openModal('dex'); }
  else if (k === 'b'){ if (G.started) openModal('shop'); }
  else if (k === 'f'){ if (G.started) openModal('fuse'); }
  if (k === 'ArrowLeft' || k === 'ArrowRight' || k === 'ArrowUp' || k === 'ArrowDown' || k === ' '){
    if (!ui.open) e.preventDefault();
  }
}, { passive:false });

window.addEventListener('keyup', function(e){
  var k = keyName(e);
  if (k === 'ArrowLeft' || k === 'a') keys.left = false;
  else if (k === 'ArrowRight' || k === 'd') keys.right = false;
  else if (k === 'ArrowUp' || k === 'w') keys.up = false;
  else if (k === 'ArrowDown' || k === 's') keys.down = false;
});
window.addEventListener('blur', function(){ keys.left = keys.right = keys.up = keys.down = false; });

function joyMove(e){
  var r = joyEl.getBoundingClientRect();
  var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  var dx = e.clientX - cx, dy = e.clientY - cy;
  var max = r.width / 2 - 12;
  var d = Math.sqrt(dx * dx + dy * dy);
  if (d > max){ dx = dx / d * max; dy = dy / d * max; d = max; }
  knob.style.transform = 'translate(' + dx.toFixed(1) + 'px,' + dy.toFixed(1) + 'px)';
  joy.x = dx / max; joy.y = dy / max;
}
function joyEnd(){
  joy.active = false; joy.id = null; joy.x = 0; joy.y = 0;
  knob.style.transform = 'translate(0px,0px)';
}
joyEl.addEventListener('pointerdown', function(e){
  if (e.button !== undefined && e.button !== 0) return;
  e.preventDefault();
  joy.active = true; joy.id = e.pointerId;
  try { joyEl.setPointerCapture(e.pointerId); } catch(err){}
  joyMove(e);
});
joyEl.addEventListener('pointermove', function(e){
  if (!joy.active || e.pointerId !== joy.id) return;
  e.preventDefault();
  joyMove(e);
});
joyEl.addEventListener('pointerup', function(e){ if (e.pointerId === joy.id) joyEnd(); });
joyEl.addEventListener('pointercancel', function(){ joyEnd(); });
joyEl.addEventListener('pointerleave', function(e){
  if (joy.active && joy.id === e.pointerId && e.buttons === 0) joyEnd();
});

var AC = null;
var audioUnlocked = false;
function audioInit(){
  try {
    if (navigator.audioSession && navigator.audioSession.type !== 'playback') {
      navigator.audioSession.type = 'playback';
    }
  } catch(e){}
  if (!AC){
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch(e){ AC = null; return; }
  }
  if (AC.state === 'suspended' && AC.resume){
    try { AC.resume(); } catch(e){}
  }
  if (!audioUnlocked && AC){
    try {
      var buf = AC.createBuffer(1, 1, 22050);
      var src = AC.createBufferSource();
      src.buffer = buf;
      src.connect(AC.destination);
      src.start(0);
      audioUnlocked = true;
    } catch(e){}
  }
}
function tone(freq, dur, type, vol, slideTo, delay){
  if (state.muted) return;
  if (!AC) audioInit();
  if (!AC) return;
  if (AC.state === 'suspended' && AC.resume){
    try { AC.resume(); } catch(e){}
  }
  try {
    var t0 = AC.currentTime + (delay || 0);
    var o = AC.createOscillator();
    var g = AC.createGain();
    var peak = Math.min(0.45, (vol || 0.08) * 2.4);
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(28, slideTo), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + 0.014);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g);
    g.connect(AC.destination);
    o.start(t0);
    o.stop(t0 + dur + 0.03);
  } catch(e){}
}

var toastBox = document.getElementById('toasts');
var toasts = [];
function toast(msg, kind){
  var d = document.createElement('div');
  d.className = 'toast' + (kind ? ' ' + kind : '');
  d.textContent = msg;
  toastBox.appendChild(d);
  toasts.push({ el:d, t:2.4, rm:0 });
  while (toasts.length > 3){
    var o = toasts.shift();
    if (o.el.parentNode) o.el.parentNode.removeChild(o.el);
  }
}
function updateToasts(dt){
  for (var i = toasts.length - 1; i >= 0; i--){
    var t = toasts[i];
    if (t.rm > 0){
      t.rm -= dt;
      if (t.rm <= 0){ if (t.el.parentNode) t.el.parentNode.removeChild(t.el); toasts.splice(i, 1); }
      continue;
    }
    t.t -= dt;
    if (t.t <= 0){
      if (t.el.classList) t.el.classList.add('out');
      t.rm = 0.32;
    }
  }
}

var TREAD = { x:398, y:306, w:176, h:102 };
var INCUB = { x:648, y:632, w:180, h:130 };

function inSafe(x){ return (x === undefined ? G.player.x : x) < SAFE_X; }
function biomeAt(x){
  for (var i = 0; i < BIOMES.length; i++) if (x >= BIOMES[i].x0 && x < BIOMES[i].x1) return i;
  return -1;
}
function onTreadmill(){
  var p = G.player;
  return Math.abs(p.x - TREAD.x) < TREAD.w / 2 && Math.abs(p.y - TREAD.y) < TREAD.h / 2;
}
function nearestNest(r){
  var p = G.player, best = null, bd = r;
  for (var i = 0; i < G.nests.length; i++){
    var n = G.nests[i];
    if (!n.occ) continue;
    var d = dst(p.x, p.y, n.x, n.y);
    if (d < bd){ bd = d; best = n; }
  }
  return best;
}
function emptyNestNear(r){
  var p = G.player, best = null, bd = r;
  for (var i = 0; i < G.nests.length; i++){
    var n = G.nests[i];
    if (n.occ) continue;
    var d = dst(p.x, p.y, n.x, n.y);
    if (d < bd){ bd = d; best = n; }
  }
  return best;
}

function burst(x, y, rgb, n, spd){
  spd = spd || 120;
  for (var i = 0; i < n; i++){
    var a = Math.random() * TAU, s = rnd(spd * 0.3, spd);
    G.parts.push({
      x:x, y:y,
      vx:Math.cos(a) * s, vy:Math.sin(a) * s - 20,
      life:rnd(0.35, 0.85), max:0.85,
      r:rnd(1.6, 4.2),
      col:rgba(rgb, rnd(0.55, 1))
    });
  }
}
function float(txt, x, y, col, size){
  G.floats.push({ txt:txt, x:x, y:y, vy:-34, life:1.1, max:1.1, col:col || '#fff', size:size || 13 });
}
function updateFX(dt){
  var i;
  for (i = G.parts.length - 1; i >= 0; i--){
    var p = G.parts[i];
    p.life -= dt;
    if (p.life <= 0){ G.parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += 220 * dt; p.vx *= (1 - 2.2 * dt);
  }
  for (i = G.floats.length - 1; i >= 0; i--){
    var f = G.floats[i];
    f.life -= dt;
    if (f.life <= 0){ G.floats.splice(i, 1); continue; }
    f.y += f.vy * dt;
    f.vy *= (1 - 1.8 * dt);
  }
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 1.6);
}

function doAction(){
  var p = G.player;
  if (!G.started || ui.open) return;
  if (p.state === 'steal' || p.state === 'hatch') return;

  if (TK.active && tkAttack()) return;

  if (p.carry){
    if (inSafe()) startHatch();
    else { toast('안전지대로 돌아가야 부화할 수 있어요! 🏃', 'bad'); SFX.no(); }
    return;
  }
  var n = nearestNest(74);
  if (n && n.occ){ startSteal(n); return; }
  if (onTreadmill()){ toast('러닝머신 위에 서 있으면 자동으로 훈련돼요 ⚡'); return; }
  var e = emptyNestNear(90);
  if (e) toast('이 둥지는 알이 없어요... 다시 채워질 때까지 기다려요 ⏳', 'bad');
  else if (inSafe()) toast('오른쪽으로 나가 알을 훔쳐 오세요! 🥚');
  else toast('알 둥지에 더 가까이 가야 해요', 'bad');
  SFX.no();
}

/* 디바인 알: 높은 구역 쪽에 비중을 두고 계속 자주 등장 */
function updateDivine(dt){
  G.divineT -= dt;
  if (G.divineT > 0) return;
  G.divineT = rnd(13, 21) * (1 - DAY.nightF() * 0.25);
  if (divineCount() >= 4) return;
  var pool = [], i, n;
  for (i = 0; i < G.nests.length; i++){
    n = G.nests[i];
    if (n.r === 6 || n === G.player.chanNest) continue;
    var w = n.b >= 3 ? 4 : (n.b === 2 ? 2 : 1);
    for (var k = 0; k < w; k++) pool.push(n);
  }
  if (!pool.length) return;
  n = pick(pool);
  var near = dst(G.player.x, G.player.y, n.x, n.y) < 1200;
  n.occ = true;
  n.r = 6;
  n.m = (Math.random() < 0.4) ? 1 : 0;
  n.pop = 0; n.respawn = 0;
  n.nm = pick(DIVINE_NAMES);
  if (near){
    burst(n.x, n.y - 12, [255, 238, 150], 24, 210);
    float('✨ ' + n.nm, n.x, n.y - 64, '#fff2b0', 14);
    SFX.divine();
  }
  if (Math.random() < 0.7) toast('✨ 디바인 알 등장! ' + n.nm + ' · ' + BIOMES[n.b].name, 'good');
}

function updateDrops(dt){

    x = clamp(TK.boss.x + rnd(-330, 330), SAFE_X + 80, WORLD_W - 90);
    y = clamp(TK.boss.y + rnd(-270, 270), 100, WORLD_H - 100);
  } else {
    x = clamp(G.player.x + rnd(-520, 520), SAFE_X + 90, WORLD_W - 90);
    y = clamp(G.player.y + rnd(-420, 420), 100, WORLD_H - 100);
  }
  TK.birds.push({ x:x, y:y, vx:0, vy:0, face:1, bob:rnd(0, 6), hurt:0, t:rnd(0.6, 2.4) });
}

function startTurkeyEvent(){
  if (!G.started){ return false; }
  if (TK.active){
    toast('🦃 이미 이벤트 중이에요 · 남은 ' + Math.ceil(TK.t) + '초', 'bad');
    return false;
  }
  TK.active = true;
  TK.t = TKD.DUR;
  TK.cd = 0;
  TK.started = G.t;
  TK.golden = Math.random() < 0.3;
  var zone = BIOMES[rndi(1, 4)];
  var bx = clamp(rnd(zone.x0 + 140, zone.x1 - 160), SAFE_X + 140, WORLD_W - 160);
  var by = rnd(200, WORLD_H - 180);
  TK.boss = {
    x:bx, y:by, vx:0, vy:0, face:1, bob:0, hurt:0,
    hp:30, max:30, wander:0, tx:bx, ty:by, dash:0, gold:TK.golden
  };
  TK.birds = [];
  for (var i = 0; i < 9; i++) spawnBird(i % 2 === 0);
  audioInit();
  SFX.boss();
  G.shake = 0.5;
  G.banner = {
    t:3.4, max:3.4, emo:'🦃', name:'터키 테이크오버',
    sub: TK.golden ? '골든 킹 고블! 보상 2배 ✨' : '킹 고블을 쫓아가 때려 잡으세요!',
    col:'#ffbe7a'
  };
  toast('🦃 터키 이벤트 시작! 깃털을 모아 🦃 터키 상점에서 쓰세요', 'good');
  saveNow();
  return true;
}

function endTurkeyEvent(quiet){
  if (!TK.active) return;
  TK.active = false;
  TK.boss = null;
  TK.birds = [];
  TK.next = rnd(TKD.NEXT[0], TKD.NEXT[1]);
  if (!quiet) toast('🦃 터키 떼가 달아났어요... 다음 이벤트를 기다려요', 'bad');
  saveNow();
}

function tkTarget(){
  var p = G.player, best = null, bd = TKD.RANGE;
  for (var i = 0; i < TK.birds.length; i++){
    var b = TK.birds[i];
    var d = dst(p.x, p.y, b.x, b.y);
    if (d < bd){ bd = d; best = { kind:'bird', it:b }; }
  }
  if (TK.boss){
    var db = dst(p.x, p.y, TK.boss.x, TK.boss.y);
    if (db < TKD.RANGE + 20 && db < bd + 26) best = { kind:'boss', it:TK.boss };
  }
  return best;
}

function tkAttack(){
  if (!TK.active || TK.cd > 0) return false;
  var t = tkTarget();
  if (!t) return false;
  var p = G.player;
  TK.cd = 0.32;
  p.anim += 0.7;
  if (t.kind === 'bird'){
    var b = t.it;
    var f = rndi(2, 5);
    state.feathers += f;
    state.stats.turkeys++;
    state.money += rndi(25, 70);
    burst(b.x, b.y - 8, [255, 190, 120], 18, 160);
    float('🪶 +' + f, b.x, b.y - 30, '#ffd7a8', 15);
    var at = TK.birds.indexOf(b);
    if (at >= 0) TK.birds.splice(at, 1);
    SFX.feather();
    float('칙!', p.x + (b.x - p.x) * 0.4, p.y - 26, '#ffe9a8', 13);
    if (TK.birds.length < 6 && Math.random() < 0.75) spawnBird(true);
  } else {
    var bo = t.it;
    var crit = Math.random() < 0.15;
    bo.hp -= crit ? 2 : 1;
    bo.hurt = 0.25;
    G.shake = 0.22;
    var f2 = crit ? 4 : 2;
    state.feathers += f2;
    float((crit ? '💥 ' : '') + '🪶 +' + f2, bo.x, bo.y - 58, crit ? '#fff2b0' : '#ffe0b0', crit ? 17 : 13);
    burst(bo.x, bo.y - 12, [255, 170, 90], 12, 170);
    SFX.hit();
    if (bo.hp <= 0) tkDefeatBoss();
  }
  return true;
}

function tkDefeatBoss(){
  var bo = TK.boss;
  if (!bo) return;
  var mult = TK.golden ? 2 : 1;
  var f = Math.round(52 * mult + rnd(0, 22));
  var money = Math.round((1400 + rnd(0, 900)) * mult);
  state.feathers += f;
  state.money += money;
  state.stats.bosses++;
  addDrop(bo.x, bo.y, 6, TK.golden ? 2 : 1, 'Divine King Gobble', Math.round(rnd(17, 25) * 10) / 10);
  burst(bo.x, bo.y - 16, [255, 220, 140], 46, 260);
  burst(bo.x, bo.y - 16, [255, 140, 80], 26, 230);
  G.shake = 0.9;
  TK.boss = null;
  TK.t = Math.min(TK.t, 14);
  float('👑 킹 고블 처치!', bo.x, bo.y - 84, '#fff0a8', 20);
  toast('👑 킹 고블 처치! 🪶 +' + f + ' · 💰 +$' + fmt(money) + ' · 디바인 알 드롭!', 'good');
  SFX.big();
  SFX.divine();
  saveNow();
}

function updateTurkey(dt){
  if (!TK.active){
    TK.next -= dt;
    if (TK.next <= 0 && G.started){
      TK.next = 9999;
      startTurkeyEvent();
    }
    return;
  }
  TK.t -= dt;
  if (TK.cd > 0) TK.cd -= dt;
  var p = G.player, b = TK.boss, i;

  if (b){
    b.bob += dt * 4.2;
    if (b.hurt > 0) b.hurt -= dt;
    if (b.dash > 0) b.dash -= dt;
    b.wander -= dt;
    var d = dst(b.x, b.y, p.x, p.y);
    var spd = 66;
    if (d < 270 && b.dash <= 0){
      b.dash = 0.75;
      b.tx = clamp(b.x + (b.x - p.x) / (d || 1) * 300, SAFE_X + 90, WORLD_W - 90);
      b.ty = clamp(b.y + (b.y - p.y) / (d || 1) * 240, 110, WORLD_H - 110);
      SFX.turkey();
    }
    if (b.wander <= 0 && b.dash <= 0){
      b.wander = rnd(1.8, 3.4);
      b.tx = clamp(b.x + rnd(-280, 280), SAFE_X + 90, WORLD_W - 90);
      b.ty = clamp(b.y + rnd(-240, 240), 110, WORLD_H - 110);
    }
    if (b.dash > 0) spd = 205;
    var ang = Math.atan2(b.ty - b.y, b.tx - b.x);
    var kk = 1 - Math.pow(0.002, dt);
    b.vx = lerp(b.vx, Math.cos(ang) * spd, kk);
    b.vy = lerp(b.vy, Math.sin(ang) * spd, kk);
    b.x = clamp(b.x + b.vx * dt, SAFE_X + 40, WORLD_W - 70);
    b.y = clamp(b.y + b.vy * dt, 90, WORLD_H - 90);
    if (b.vx < -8) b.face = -1; else if (b.vx > 8) b.face = 1;
    if (Math.random() < dt * 3){
      G.parts.push({
        x:b.x + rnd(-16, 16), y:b.y + 14, vx:rnd(-20, 20), vy:rnd(-30, -6),
        life:rnd(0.3, 0.6), max:0.6, r:rnd(1.4, 3), col:'rgba(255,196,120,.6)'
      });
    }
  }

  for (i = TK.birds.length - 1; i >= 0; i--){
    var bd = TK.birds[i];
    bd.bob += dt * 7;
    if (bd.hurt > 0) bd.hurt -= dt;
    var dd = dst(bd.x, bd.y, p.x, p.y);
    if (dd < 230){
      var fa = Math.atan2(bd.y - p.y, bd.x - p.x);
      bd.vx = lerp(bd.vx, Math.cos(fa) * 180, 1 - Math.pow(0.02, dt));
      bd.vy = lerp(bd.vy, Math.sin(fa) * 180, 1 - Math.pow(0.02, dt));
    } else {
      bd.t -= dt;
      if (bd.t <= 0){
        bd.t = rnd(0.8, 2.6);
        var a2 = Math.random() * TAU;
        bd.vx = Math.cos(a2) * 44;
        bd.vy = Math.sin(a2) * 44;
      }
    }
    bd.x = clamp(bd.x + bd.vx * dt, SAFE_X + 40, WORLD_W - 60);
    bd.y = clamp(bd.y + bd.vy * dt, 80, WORLD_H - 80);
    if (bd.vx < -8) bd.face = -1; else if (bd.vx > 8) bd.face = 1;
  }
  if (TK.birds.length < 6 && Math.random() < dt * 0.5) spawnBird(true);

  if (TK.t <= 0) endTurkeyEvent(TK.boss === null);
}

function tkBuy(k){
  var it = null, i;
  for (i = 0; i < TKSHOP.length; i++) if (TKSHOP[i].k === k) it = TKSHOP[i];
  if (!it) return;
  if (k === 'skin' && state.skin === 'turkey'){ toast('이미 터키 농장 스킨을 쓰고 있어요 🌾'); return; }
  if (state.feathers < it.cost){ toast('깃털이 부족해요 🪶 ' + fmt(state.feathers) + ' / ' + it.cost, 'bad'); SFX.no(); return; }

  if (k === 'maple'){
    var best = null;
    for (i = 0; i < state.pets.length; i++){
      var pt = state.pets[i];
      if (pt.m === 3) continue;
      if (!best || petIncome(pt.r, 3, pt.w) > petIncome(best.r, 3, best.w)) best = pt;
    }
    if (!best){ toast('메이플 변이를 줄 펫이 없어요 🍁', 'bad'); SFX.no(); return; }
    state.feathers -= it.cost;
    best.m = 3;
    best.inc = petIncome(best.r, 3, best.w);
    var key = best.r + '_3';
    state.dex[key] = (state.dex[key] || 0) + 1;
    if (best.inc > state.stats.bestInc) state.stats.bestInc = best.inc;
    burst(best.x, best.y - 10, [255, 140, 60], 26, 200);
    float('🍁 ×2.9', best.x, best.y - 30, '#ffb27a', 14);
    toast('🍁 메이플 변이! ' + RAR[best.r].n + ' 펫 수입 +$' + fmt1(best.inc) + '/s', 'good');
    SFX.buy();
  } else {
    state.feathers -= it.cost;
    if (k === 'cornu'){
      addDrop(G.player.x + 40, G.player.y + 10, 6, 1, 'Cornuclaw');
      toast('🌽 Cornuclaw 알을 받았어요! 발밑 알을 주우세요', 'good');
    } else if (k === 'moose'){
      addDrop(G.player.x - 40, G.player.y + 10, 5, 0, 'Mapleleaf Moose');
      toast('🦌 Mapleleaf Moose 알을 받았어요! 발밑 알을 주우세요', 'good');
    } else if (k === 'skin'){
      state.skin = 'turkey';
      toast('🌾 터키 농장 스킨 적용! 가을빛 농장이에요', 'good');
    }
    SFX.buy();
  }
  saveNow();
  if (ui.kind === 'turkey') renderTurkey();
}

/* =========================================================
   14. Fuse
   ========================================================= */
function fuseOdds(){
  return [
    { k:'그대로', p:0.40 },
    { k:'+1 등급', p:0.35 },
    { k:'+2 등급', p:0.18 },
    { k:'+3 등급', p:0.07 }
  ];
}
function doFuse(idxs){
  if (!idxs || idxs.length !== 3) return false;
  var chosen = [], i;
  for (i = 0; i < idxs.length; i++){
    var p = state.pets[idxs[i]];
    if (!p) return false;
    chosen.push(p);
  }
  var maxR = 0, anyMut = false, wsum = 0;
  for (i = 0; i < 3; i++){
    if (chosen[i].r > maxR) maxR = chosen[i].r;
    if (chosen[i].m > 0) anyMut = true;
    wsum += chosen[i].w;
  }
  var r = Math.random(), up = 0;
  if (r < 0.07) up = 3;
  else if (r < 0.25) up = 2;
  else if (r < 0.60) up = 1;
  var newR = clamp(maxR + up, 0, RAR.length - 1);
  var pGold = 0.10 + (anyMut ? 0.05 : 0);
  var mm = Math.random();
  var newM = mm < 0.03 ? 2 : (mm < 0.03 + pGold ? 1 : 0);
  var w = Math.max(0.6, Math.round(wsum * rnd(0.5, 0.95) * 10) / 10);

  var keep = [];
  for (i = 0; i < state.pets.length; i++) if (idxs.indexOf(i) < 0) keep.push(state.pets[i]);
  state.pets = keep;
  var pet = {
    r:newR, m:newM, w:w, e:pick(RAR[newR].emo), inc:petIncome(newR, newM, w),
    x:rnd(200, 800), y:rnd(250, 800), vx:0, vy:0, wt:0, bob:rnd(0, 6)
  };
  state.pets.push(pet);
  state.stats.fused++;
  if (w > state.stats.bestW) state.stats.bestW = w;
  if (pet.inc > state.stats.bestInc) state.stats.bestInc = pet.inc;
  var key = newR + '_' + newM;
  var isNew = !state.dex[key];
  state.dex[key] = (state.dex[key] || 0) + 1;
  SFX.fuse();
  burst(G.player.x, G.player.y - 20, RAR[newR].rgb, 30, 240);
  closeModal();
  showReveal(pet, isNew);
  saveNow();
  return true;
}

/* =========================================================
   15. Update
   ========================================================= */
function updatePlayer(dt){
  var p = G.player;

  if (p.state === 'steal'){
    p.chan -= dt;
    p.vx *= 0.6; p.vy *= 0.6;
    p.anim += dt * 3;
    if (p.chan <= 0){
      var n = p.chanNest;
      p.state = 'idle';
      finishSteal(n);
    }
    return;
  }

  if (p.state === 'hatch'){
    p.hatch -= dt;
    p.vx *= 0.5; p.vy *= 0.5;
    if (Math.random() < dt * 14){
      var rgb = RAR[p.carry ? p.carry.r : 0].rgb;
      G.parts.push({
        x:p.x + rnd(-16, 16), y:p.y - 26 + rnd(-10, 10),
        vx:rnd(-18, 18), vy:rnd(-40, -6), life:rnd(0.3, 0.7), max:0.7,
        r:rnd(1.3, 3), col:rgba(rgb, 0.9)
      });
    }
    if (p.hatch <= 0) finishHatch();
    return;
  }

  var iv = inputVec();
  var sp = playerSpeedNow();
  var k = 1 - Math.pow(0.0008, dt);
  p.vx = lerp(p.vx, iv.x * sp, k);
  p.vy = lerp(p.vy, iv.y * sp, k);
  p.x = clamp(p.x + p.vx * dt, 26, WORLD_W - 26);
  p.y = clamp(p.y + p.vy * dt, 60, WORLD_H - 40);

  var spd = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
  if (spd > 14){
    if (p.vx < -4) p.face = -1; else if (p.vx > 4) p.face = 1;
    p.anim += dt * (3.5 + spd / 26);
    p.bob = Math.sin(p.anim * 2) * 1.8;
    if (spd > 110 && Math.random() < dt * 16){
      G.parts.push({
        x:p.x + rnd(-7, 7), y:p.y + 15, vx:-p.vx * 0.05 + rnd(-8, 8), vy:-p.vy * 0.04 - rnd(2, 10),
        life:rnd(0.25, 0.5), max:0.5, r:rnd(1.6, 3.4), col:'rgba(240,245,255,.45)'
      });
    }
    if (spd > 60 && Math.random() < dt * 3.2) SFX.step();
  } else {
    p.anim += dt * 1.6;
    p.bob = Math.sin(p.anim) * 0.7;
  }

  /* treadmill */
  if (onTreadmill()){
    var gain = trainRate() * dt;
    state.speed += gain;
    G.trainAcc = (G.trainAcc || 0) + dt;
    if (G.trainAcc > 0.55){
      G.trainAcc = 0;
      float('+' + fmt1(trainRate()) + ' 스피드', p.x + rnd(-18, 18), p.y - 46, '#8fe3ff', 12);
      SFX.train();
    }
    if (Math.random() < dt * 10){
      G.parts.push({
        x:p.x + rnd(-30, 30), y:p.y + rnd(8, 26), vx:rnd(-30, 30), vy:rnd(-50, -10),
        life:rnd(0.25, 0.6), max:0.6, r:rnd(1.2, 2.6), col:'rgba(143,227,255,.75)'
      });
    }
  }

  /* idle hint */
  var spd2 = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
  if (inSafe() && spd2 < 20 && !p.carry && !onTreadmill() && p.state === 'idle'){
    G.idleT = (G.idleT || 0) + dt;
    if (G.idleT > 14){
      G.idleT = 0;
      toast('👉 오른쪽으로 나가면 알 둥지가 있어요!', 'good');
    }
  } else {
    G.idleT = 0;
  }

  /* biome crossing banner + safe zone notice */
  var bIdx = biomeAt(p.x);
  if (bIdx !== G.lastBiome){
    G.lastBiome = bIdx;
    if (bIdx >= 0){
      var b = BIOMES[bIdx];
      G.banner = { t:2.4, max:2.4, emo:b.emo, name:b.name, sub:'필요 스피드 ' + b.req + ' · ' + b.note, col:b.acc };
      if (state.speed < b.req){
        toast('⚠️ 스피드가 부족해요! 여기 수호자는 ' + b.req + ' 필요', 'bad');
      }
    } else if (inSafe()){
      if (p.carry) toast('🏠 안전지대 도착! 🐣 부화하세요', 'good');
    }
  }
}

function updateGuardians(dt){
  var p = G.player;
  for (var i = 0; i < G.guardians.length; i++){
    var g = G.guardians[i], b = BIOMES[i];
    g.bob += dt * 3.4;

    if (g.stun > 0){
      g.stun -= dt;
      g.vx *= 0.8; g.vy *= 0.8;
      continue;
    }

    if (g.state === 'chase'){
      g.chaseT += dt;
      if (g.wake > 0){
        g.wake -= dt;
        g.vx *= 0.7; g.vy *= 0.7;
        continue;
      }
      var far = dst(g.x, g.y, p.x, p.y);
      if (p.x < SAFE_X - 2 || g.chaseT > 15 || far > 1800){
        giveUp(g);
        continue;
      }
      var pn = playerSpeedNow();
      var base = pxSpeed(b.req);
      var gs;
      if (state.speed >= b.req) gs = Math.min(base * 0.97, pn * 0.86);
      else gs = Math.min(base * 1.25, pn * 1.22);
      gs = Math.max(gs, 74);

      var ang = Math.atan2(p.y - g.y, p.x - g.x);
      var kk = 1 - Math.pow(0.001, dt);
      g.vx = lerp(g.vx, Math.cos(ang) * gs, kk);
      g.vy = lerp(g.vy, Math.sin(ang) * gs, kk);
      g.x = clamp(g.x + g.vx * dt, SAFE_X - 4, WORLD_W - 30);
      g.y = clamp(g.y + g.vy * dt, 24, WORLD_H - 46);
      if (g.vx < -6) g.face = -1; else if (g.vx > 6) g.face = 1;

      if (far < 25){
        catchPlayer(g);
        continue;
      }
      if (Math.random() < dt * 6){
        G.parts.push({
          x:g.x + rnd(-14, 14), y:g.y + rnd(-6, 14), vx:rnd(-30, 30), vy:rnd(-24, 6),
          life:rnd(0.2, 0.5), max:0.5, r:rnd(1.5, 3.2), col:'rgba(255,120,120,.55)'
        });
      }
      continue;
    }

    if (g.state === 'return'){
      var dh = dst(g.x, g.y, g.hx, g.hy);
      if (dh < 42){ g.state = 'patrol'; g.wander = rnd(1, 3); }
      else moveGuardian(g, g.hx, g.hy, 150, dt);
      continue;
    }

    /* patrol */
    g.wander -= dt;
    if (g.wander <= 0){
      g.wander = rnd(2.6, 5.4);
      g.tx = b.x0 + 80 + rnd(0, b.w - 160);
      g.ty = rnd(150, WORLD_H - 150);
    }
    if (dst(g.x, g.y, g.tx, g.ty) > 20) moveGuardian(g, g.tx, g.ty, 56, dt);
    else { g.vx *= 0.9; g.vy *= 0.9; }
  }
}

function moveGuardian(g, tx, ty, speed, dt){
  var ang = Math.atan2(ty - g.y, tx - g.x);
  var kk = 1 - Math.pow(0.004, dt);
  g.vx = lerp(g.vx, Math.cos(ang) * speed, kk);
  g.vy = lerp(g.vy, Math.sin(ang) * speed, kk);
  g.x += g.vx * dt;
  g.y += g.vy * dt;
  g.x = clamp(g.x, BIOMES[g.b].x0 + 20, BIOMES[g.b].x1 - 20);
  g.y = clamp(g.y, 80, WORLD_H - 80);
  if (g.vx < -6) g.face = -1; else if (g.vx > 6) g.face = 1;
}

function updateNests(dt){
  for (var i = 0; i < G.nests.length; i++){
    var n = G.nests[i];
    if (n.occ){
      if (n.pop < 1) n.pop = Math.min(1, n.pop + dt * 2.2);
    } else {
      n.respawn -= dt;
      if (n.respawn <= 0){
        n.occ = true;
        n.r = rollRarity(BIOMES[n.b]);
        n.m = rollMut(BIOMES[n.b]);
        n.nm = null;
        n.pop = 0;
      }
    }
  }
}

function updateTraps(dt){
  for (var i = G.traps.length - 1; i >= 0; i--){
    var t = G.traps[i];
    t.life -= dt; t.ph += dt * 3;
    if (t.life <= 0){ G.traps.splice(i, 1); continue; }
    for (var j = 0; j < G.guardians.length; j++){
      var g = G.guardians[j];
      if (g.stun > 0) continue;
      if (dst(g.x, g.y, t.x, t.y) < 32){
        g.stun = 3;
        g.vx = 0; g.vy = 0;
        burst(t.x, t.y, [255, 211, 94], 18, 190);
        float('덫! 💫', g.x, g.y - 44, '#ffd35e', 17);
        SFX.stun();
        G.shake = 0.2;
        G.traps.splice(i, 1);
        break;
      }
    }
  }
}

function updatePets(dt){
  for (var i = 0; i < state.pets.length; i++){
    var p = state.pets[i];
    p.bob = (p.bob || 0) + dt * 4.2;
    p.wt = (p.wt || 0) - dt;
    if (p.wt <= 0){
      p.wt = rnd(1.1, 3.6);
      p.vx = rnd(-26, 26);
      p.vy = rnd(-18, 18);
    }
    p.x = clamp((p.x || 500) + (p.vx || 0) * dt, 120, 890);
    p.y = clamp((p.y || 500) + (p.vy || 0) * dt, 130, WORLD_H - 90);
    if (p.x <= 121 || p.x >= 889) p.vx *= -1;
    if (p.y <= 131 || p.y >= WORLD_H - 91) p.vy *= -1;
  }
}

function updateIncome(dt){
  var inc = incomePerSec();
  if (inc > 0) state.money += inc * dt;
  G.incomePulse -= dt;
  if (inc > 0 && state.pets.length && G.incomePulse <= 0){
    G.incomePulse = rnd(0.85, 1.7);
    var p = pick(state.pets);
    float('+$' + fmt1(p.inc), p.x + rnd(-6, 6), p.y - 28, '#8dffb8', 12);
    if (Math.random() < 0.45) SFX.coin();
  }
  if (state.traps < trapCap()){
    state.trapTimer += dt;
    if (state.trapTimer >= TRAP_RECHARGE){
      state.trapTimer = 0;
      state.traps++;
      toast('🪤 덫 +1 충전됐어요', 'good');
    }
  } else {
    state.trapTimer = 0;
  }
}

function updateCamera(dt){
  var p = G.player;
  var tx = p.x + p.vx * 0.18;
  var ty = p.y + p.vy * 0.12;
  var zh = VW / (2 * G.zoom), zv = VH / (2 * G.zoom);
  if (zh * 2 >= WORLD_W) tx = WORLD_W / 2; else tx = clamp(tx, zh, WORLD_W - zh);
  if (zv * 2 >= WORLD_H) ty = WORLD_H / 2; else ty = clamp(ty, zv, WORLD_H - zv);
  var k = 1 - Math.pow(0.00005, dt);
  G.cam.x = lerp(G.cam.x, tx, k);
  G.cam.y = lerp(G.cam.y, ty, k);
}

function update(dt){
  G.t += dt;
  DAY.advance(dt);
  if (!ui.open){
    updatePlayer(dt);
    updateGuardians(dt);
    updateTraps(dt);
    updateTurkey(dt);
    updateDivine(dt);
    updateDrops(dt);
    updateFlies(dt);
  }
  updateNests(dt);
  updatePets(dt);
  updateIncome(dt);
  updateFX(dt);
  updateCamera(dt);
  updateToasts(dt);
  updateHUD(dt);
  updateRail();
  if (G.banner && G.banner.t > 0) G.banner.t -= dt;

  G.saveT += dt;
  if (G.saveT > 5){ G.saveT = 0; saveNow(); }
}

/* =========================================================
   16. Drawing primitives
   ========================================================= */
function circle(x, y, r){ ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); }
function ell(x, y, rx, ry, rot){ ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, TAU); }
function rr(x, y, w, h, r){
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}
function label(txt, x, y, size, col, align){
  ctx.font = '900 ' + size + 'px -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif';
  ctx.textAlign = align || 'center';
  ctx.lineWidth = Math.max(2.5, size * 0.28);
  ctx.strokeStyle = 'rgba(8,16,12,.6)';
  ctx.strokeText(txt, x, y);
  ctx.fillStyle = col;
  ctx.fillText(txt, x, y);
  ctx.textAlign = 'left';
}
function w2s(x, y){ return { x:(x - G.cam.x) * G.zoom + VW / 2, y:(y - G.cam.y) * G.zoom + VH / 2 }; }
function viewBounds(){
  var hw = VW / (2 * G.zoom), hh = VH / (2 * G.zoom);
  return { x0:G.cam.x - hw - 90, x1:G.cam.x + hw + 90, y0:G.cam.y - hh - 90, y1:G.cam.y + hh + 90 };
}

/* ---------- 낮/밤 ---------- */
function applyDayTint(){
  var t = DAY.tint();
  ctx.save();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'multiply';
  ctx.fillStyle = 'rgb(' + t[0] + ',' + t[1] + ',' + t[2] + ')';
  ctx.fillRect(0, 0, VW, VH);
  ctx.restore();
}

var STARS = null;
function nightStars(){
  if (STARS) return STARS;
  STARS = [];
  var rng = mulberry32(778899);
  for (var i = 0; i < 92; i++){
    STARS.push({ x:rng(), y:rng() * 0.82, r:0.5 + rng() * 1.6, ph:rng() * TAU, sp:0.5 + rng() * 1.8 });
  }
  return STARS;
}
function updateFlies(dt){
  if (DAY.nightF() <= 0.02) return;
  for (var i = 0; i < G.flies.length; i++){
    var f = G.flies[i];
    f.ph += dt * f.sp * 2;
    f.x += Math.cos(f.ph * 1.3) * 11 * dt + f.vx * dt;
    f.y += Math.sin(f.ph) * 8 * dt + f.vy * dt;
    if (Math.random() < dt * 0.5){ f.vx = rnd(-10, 10); f.vy = rnd(-8, 8); }
    if (f.x < 30) f.x = WORLD_W - 40; else if (f.x > WORLD_W - 30) f.x = 40;
    if (f.y < 40) f.y = WORLD_H - 50; else if (f.y > WORLD_H - 40) f.y = 55;
  }
}
function drawNight(vb){
  var nf = DAY.nightF();
  if (nf <= 0.02) return;
  var i;
  /* 반짝이는 별 */
  ctx.save();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'lighter';
  var st = nightStars();
  var ox = (G.cam.x * 0.055) % VW, oy = (G.cam.y * 0.04) % (VH * 0.85);
  for (i = 0; i < st.length; i++){
    var s = st[i];
    var tw = 0.4 + 0.6 * Math.abs(Math.sin(G.t * s.sp + s.ph));
    var sx = ((s.x * VW - ox) % VW + VW) % VW;
    var sy = ((s.y * VH * 0.85 - oy) % (VH * 0.85) + VH * 0.85) % (VH * 0.85);
    ctx.globalAlpha = nf * tw * 0.92;
    ctx.fillStyle = '#e4ecff';
    circle(sx, sy, s.r); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  /* 밤에 빛나는 농장 */
  if (nf > 0.15){
    var spots = [
      [INCUB.x, INCUB.y, 130, 'rgba(255,226,150,'],
      [210, 760, 120, 'rgba(255,196,120,'],
      [810, 286, 74, 'rgba(150,215,255,']
    ];
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (i = 0; i < spots.length; i++){
      var sp = spots[i];
      if (sp[0] < vb.x0 - 200 || sp[0] > vb.x1 + 200 || sp[1] < vb.y0 - 200 || sp[1] > vb.y1 + 200) continue;
      var gg = ctx.createRadialGradient(sp[0], sp[1], 6, sp[0], sp[1], sp[2]);
      gg.addColorStop(0, sp[3] + (0.26 * nf) + ')');
      gg.addColorStop(0.55, sp[3] + (0.10 * nf) + ')');
      gg.addColorStop(1, sp[3] + '0)');
      ctx.fillStyle = gg;
      circle(sp[0], sp[1], sp[2]); ctx.fill();
    }
    ctx.restore();
  }
  /* 반딧불이 */
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (i = 0; i < G.flies.length; i++){
    var f = G.flies[i];
    if (f.x < vb.x0 || f.x > vb.x1 || f.y < vb.y0 || f.y > vb.y1) continue;
    var pl = 0.3 + 0.7 * Math.abs(Math.sin(G.t * f.sp * 1.6 + f.ph));
    var a = nf * pl;
    ctx.fillStyle = 'rgba(180,255,140,' + (0.22 * a) + ')';
    circle(f.x, f.y, 8); ctx.fill();
    ctx.fillStyle = 'rgba(240,255,200,' + (0.85 * a) + ')';
    circle(f.x, f.y, 1.7); ctx.fill();
  }
  ctx.restore();
}

/* ---------- 바닥에 떨어진 알 ---------- */
function drawDrop(d){
  var cr = RAR[d.r];
  var pop = easeOut(clamp(d.pop, 0, 1));
  ctx.save();
  ctx.translate(d.x, d.y);
  ctx.fillStyle = 'rgba(0,0,0,.22)';
  ell(0, 16, 17, 6); ctx.fill();
  ctx.translate(0, -14 + Math.sin(d.bob) * 5 - (1 - pop) * 24);
  ctx.scale(pop, pop);
  ctx.rotate(Math.sin(G.t * 2.4 + d.bob) * 0.08);
  ctx.shadowColor = rgba(cr.rgb, 0.9);
  ctx.shadowBlur = 24;
  var eg = ctx.createRadialGradient(-5, -7, 1, 0, 0, 20);
  eg.addColorStop(0, '#ffffff');
  eg.addColorStop(0.5, rgba(cr.rgb, 1));
  eg.addColorStop(1, cr.dark);
  ctx.fillStyle = eg;
  ell(0, 0, 13, 17); ctx.fill();
  ctx.shadowBlur = 0;
  var aq;
  for (aq = 0; aq < 3; aq++){
    ctx.strokeStyle = 'hsla(' + ((G.t * 70 + aq * 120) % 360) + ',100%,72%,.6)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(0, 0, 20 + aq * 5, 24 + aq * 5, 0, 0, TAU);
    ctx.stroke();
  }
  if (d.m){
    ctx.strokeStyle = rgba(MUT[d.m].rgb, 0.85);
    ctx.lineWidth = 2.2;
    ctx.setLineDash([5, 5]);
    ctx.lineDashOffset = -G.t * 22;
    ctx.beginPath();
    ctx.ellipse(0, 0, 17, 21, 0, 0, TAU);
    ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.restore();
  if (d.nm) label(d.nm, d.x, d.y - 48, 11.5, '#ffeaa0');
}

/* ---------- 야생 칠면조 / 킹 고블 ---------- */
function drawTurkBird(b){
  var bob = Math.sin(b.bob) * 3.4;
  ctx.save();
  ctx.translate(b.x, b.y + bob);
  ctx.fillStyle = 'rgba(0,0,0,.22)';
  ell(0, 15, 12, 4.6); ctx.fill();
  ctx.save();
  ctx.scale(b.face < 0 ? -1 : 1, 1);
  ctx.font = '900 27px -apple-system,"Apple Color Emoji","Segoe UI Emoji",sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  if (b.hurt > 0) ctx.globalAlpha = 0.55;
  ctx.fillText('🦃', 0, 0);
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left';
  ctx.restore();
  ctx.restore();
  if (b.hurt > 0) label('🪶', b.x, b.y - 26, 13, '#ffd7a8');
}

function drawTurkBoss(b){
  var pulse = 1 + Math.sin(G.t * 3.2) * 0.035;
  var col = b.gold ? [255, 214, 90] : [255, 140, 80];
  ctx.save();
  ctx.translate(b.x, b.y + Math.sin(b.bob) * 3);
  var rg = ctx.createRadialGradient(0, 0, 14, 0, 0, 96);
  rg.addColorStop(0, rgba(col, 0.34));
  rg.addColorStop(0.6, rgba(col, 0.12));
  rg.addColorStop(1, rgba(col, 0));
  ctx.fillStyle = rg;
  circle(0, 0, 96); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.26)';
  ell(0, 44, 34, 11); ctx.fill();

  ctx.save();
  ctx.scale((b.face < 0 ? -1 : 1) * pulse, pulse);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = rgba(col, 0.85);
  ctx.shadowBlur = b.gold ? 30 : 16;
  if (b.hurt > 0) ctx.globalAlpha = 0.6;
  ctx.font = '900 78px -apple-system,"Apple Color Emoji","Segoe UI Emoji",sans-serif';
  ctx.fillText('🦃', 0, 0);
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  ctx.font = '900 30px -apple-system,"Apple Color Emoji","Segoe UI Emoji",sans-serif';
  ctx.fillText('👑', 0, -48);
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left';
  ctx.restore();

  var w = 86, hp = clamp(b.hp / b.max, 0, 1);
  ctx.fillStyle = 'rgba(8,12,20,.86)';
  rr(-w / 2, -98, w, 12, 6); ctx.fill();
  ctx.fillStyle = b.gold ? '#ffd35e' : '#ff7b4d';
  rr(-w / 2 + 2, -96, (w - 4) * hp, 8, 4); ctx.fill();
  ctx.restore();
  label((b.gold ? '골든 킹 고블 ' : '킹 고블 ') + Math.max(0, b.hp) + '/' + b.max, b.x, b.y - 108, 12.5, b.gold ? '#ffeaa0' : '#ffd0b0');
}

function drawTurkeys(vb){
  if (!TK.active) return;
  for (var i = 0; i < TK.birds.length; i++){
    var b = TK.birds[i];
    if (b.x < vb.x0 || b.x > vb.x1 || b.y < vb.y0 || b.y > vb.y1) continue;
    drawTurkBird(b);
  }
  if (TK.boss) drawTurkBoss(TK.boss);
}

/* =========================================================
   17. World drawing
   ========================================================= */
function drawWorld(){
  var vb = viewBounds();
  var i, j;

  drawPenGround(vb);

  for (i = 0; i < BIOMES.length; i++){
    if (BIOMES[i].x1 < vb.x0 || BIOMES[i].x0 > vb.x1) continue;
    drawBiomeGround(i, vb);
  }
  for (i = 0; i < G.deco.length; i++){
    var d = G.deco[i];
    if (d.x < vb.x0 || d.x > vb.x1 || d.y < vb.y0 || d.y > vb.y1) continue;
    drawDeco(d);
  }
  drawBiomeEdges(vb);
  drawSafeLine();

  applyDayTint();
  drawNight(vb);

  /* dropped eggs */
  for (i = 0; i < G.drops.length; i++) drawDrop(G.drops[i]);

  /* traps */
  for (i = 0; i < G.traps.length; i++) drawTrap(G.traps[i]);

  /* nests */
  for (i = 0; i < G.nests.length; i++){
    var n = G.nests[i];
    if (n.x < vb.x0 || n.x > vb.x1 || n.y < vb.y0 || n.y > vb.y1) continue;
    drawNest(n);
  }

  /* pets (only in pen) */
  for (i = 0; i < state.pets.length; i++) drawPet(state.pets[i]);

  /* guardians */
  for (i = 0; i < G.guardians.length; i++){
    var g = G.guardians[i];
    if (g.x < vb.x0 || g.x > vb.x1 || g.y < vb.y0 || g.y > vb.y1) continue;
    drawGuardian(g);
  }

  drawTurkeys(vb);

  drawPlayer();

  /* fx */
  for (i = 0; i < G.parts.length; i++){
    var p = G.parts[i];
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    ctx.fillStyle = p.col;
    circle(p.x, p.y, p.r); ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (i = 0; i < G.floats.length; i++){
    var f = G.floats[i];
    var a = clamp(f.life / f.max, 0, 1);
    ctx.globalAlpha = a;
    ctx.font = '900 ' + f.size + 'px -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif';
    ctx.textAlign = 'center';
    ctx.lineWidth = 3.5;
    ctx.strokeStyle = 'rgba(6,10,18,.75)';
    ctx.strokeText(f.txt, f.x, f.y);
    ctx.fillStyle = f.col;
    ctx.fillText(f.txt, f.x, f.y);
    ctx.globalAlpha = 1;
  }
  ctx.textAlign = 'left';

  drawPointers();
  drawEventPointers();
}

function drawPenGround(vb){
  var ps = (state.skin === 'turkey')
    ? { a:'#7c5a2b', b:'#966d35', c:'#6b4f26', stripe:'#ffe2a8', light:'rgba(255,214,140,.22)', tuft:'rgba(74,48,18,.55)', tuft2:'rgba(255,214,150,.4)' }
    : { a:'#3f7c46', b:'#4d9152', c:'#3b7342', stripe:'#eaffd0', light:'rgba(255,246,190,.16)', tuft:'rgba(24,74,38,.5)', tuft2:'rgba(168,232,150,.35)' };
  var g = ctx.createLinearGradient(0, 0, 0, WORLD_H);
  g.addColorStop(0, ps.a);
  g.addColorStop(0.5, ps.b);
  g.addColorStop(1, ps.c);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, SAFE_X, WORLD_H);

  /* mowed lawn stripes */
  ctx.save();
  ctx.globalAlpha = 0.032;
  ctx.fillStyle = ps.stripe;
  for (var sx = -200; sx < PEN_X1 + 200; sx += 168){
    ctx.beginPath();
    ctx.moveTo(sx, 0);
    ctx.lineTo(sx + 84, 0);
    ctx.lineTo(sx + 84 + WORLD_H * 0.5, WORLD_H);
    ctx.lineTo(sx + WORLD_H * 0.5, WORLD_H);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  /* soft light */
  var rg = ctx.createRadialGradient(500, 400, 40, 500, 400, 620);
  rg.addColorStop(0, ps.light);
  rg.addColorStop(1, 'rgba(255,246,190,0)');
  ctx.fillStyle = rg;
  ctx.fillRect(0, 0, SAFE_X, WORLD_H);

  /* dirt path */
  ctx.fillStyle = 'rgba(206,178,124,.55)';
  ctx.beginPath();
  ctx.moveTo(SAFE_X, 400);
  ctx.quadraticCurveTo(800, 440, 660, 520);
  ctx.quadraticCurveTo(500, 610, 330, 660);
  ctx.lineTo(330, 716);
  ctx.quadraticCurveTo(520, 668, 700, 574);
  ctx.quadraticCurveTo(860, 486, SAFE_X, 476);
  ctx.closePath();
  ctx.fill();

  /* grass tufts & flowers */
  var i;
  var pvb = viewBounds();
  for (i = 0; i < G.decoPen.length; i++){
    var d = G.decoPen[i];
    if (d.x < pvb.x0 || d.x > pvb.x1 || d.y < pvb.y0 || d.y > pvb.y1) continue;
    if (d.t < 0.62){
      ctx.strokeStyle = ps.tuft;
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.moveTo(d.x, d.y);
      ctx.quadraticCurveTo(d.x + 4 * d.s, d.y - 10 * d.s, d.x + 9 * d.s, d.y - 15 * d.s);
      ctx.moveTo(d.x, d.y);
      ctx.quadraticCurveTo(d.x - 3 * d.s, d.y - 11 * d.s, d.x - 8 * d.s, d.y - 14 * d.s);
      ctx.moveTo(d.x + 1, d.y);
      ctx.quadraticCurveTo(d.x + 1 * d.s, d.y - 12 * d.s, d.x + 2 * d.s, d.y - 17 * d.s);
      ctx.stroke();
      ctx.strokeStyle = ps.tuft2;
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(d.x + 1, d.y - 2);
      ctx.quadraticCurveTo(d.x + 2 * d.s, d.y - 11 * d.s, d.x + 3 * d.s, d.y - 15 * d.s);
      ctx.stroke();
    } else if (d.t < 0.80){
      var cols = ['#ffe08a', '#ffb3c9', '#d6c2ff', '#ffffff', '#ffd0a8'];
      ctx.strokeStyle = 'rgba(30,90,44,.5)';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(d.x, d.y + 2);
      ctx.lineTo(d.x, d.y + 8 * d.s);
      ctx.stroke();
      ctx.fillStyle = cols[Math.floor(d.ph * 5) % 5];
      for (var pi = 0; pi < 4; pi++){
        var pa = pi * TAU / 4 + d.ph;
        circle(d.x + Math.cos(pa) * 2.6 * d.s, d.y + Math.sin(pa) * 2.6 * d.s, 2.6 * d.s);
        ctx.fill();
      }
      ctx.fillStyle = '#fff3a8';
      circle(d.x, d.y, 1.7 * d.s); ctx.fill();
    } else if (d.t < 0.92){
      ctx.fillStyle = 'rgba(96,168,94,.38)';
      ell(d.x, d.y, 18 * d.s, 11 * d.s, d.ph); ctx.fill();
      ctx.fillStyle = 'rgba(150,215,140,.22)';
      ell(d.x - 4 * d.s, d.y - 3 * d.s, 8 * d.s, 5 * d.s, d.ph); ctx.fill();
    } else {
      ctx.fillStyle = 'rgba(180,175,160,.5)';
      ell(d.x, d.y, 4 * d.s, 3 * d.s, d.ph); ctx.fill();
    }
  }

  /* soft grass patches */
  for (i = 0; i < 7; i++){
    var px0 = 120 + (i * 137) % 760, py0 = 140 + (i * 271) % 620;
    var rg2 = ctx.createRadialGradient(px0, py0, 10, px0, py0, 150);
    rg2.addColorStop(0, 'rgba(150,215,140,.10)');
    rg2.addColorStop(1, 'rgba(150,215,140,0)');
    ctx.fillStyle = rg2;
    ell(px0, py0, 160, 120); ctx.fill();
  }

  drawFence();
  drawWell();
  drawBarn();
  drawTreadmill();
  drawIncubator();

  /* farm sign */
  ctx.save();
  ctx.translate(120, 120);
  ctx.fillStyle = '#7a5327';
  rr(-64, -18, 128, 44, 8); ctx.fill();
  ctx.fillStyle = '#9d6c33';
  rr(-60, -22, 120, 44, 8); ctx.fill();
  ctx.fillStyle = '#3d2a12';

function drawFence(){
  var step = 62, x, y;
  ctx.save();
  /* rails */
  ctx.strokeStyle = 'rgba(150,110,66,.85)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(PEN_X0, 44); ctx.lineTo(PEN_X1, 44);
  ctx.moveTo(PEN_X0, WORLD_H - 44); ctx.lineTo(PEN_X1, WORLD_H - 44);
  ctx.moveTo(PEN_X0 - 2, 44); ctx.lineTo(PEN_X0 - 2, WORLD_H - 44);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.14)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(PEN_X0, 40); ctx.lineTo(PEN_X1, 40);
  ctx.moveTo(PEN_X0, WORLD_H - 48); ctx.lineTo(PEN_X1, WORLD_H - 48);
  ctx.stroke();

  /* posts */
  function post(px, py){
    ctx.fillStyle = 'rgba(0,0,0,.18)';
    ell(px + 2, py + 12, 7, 3); ctx.fill();
    ctx.fillStyle = '#8a5f30';
    rr(px - 4.5, py - 18, 9, 30, 3); ctx.fill();
    ctx.fillStyle = '#b98a4e';
    rr(px - 4.5, py - 18, 9, 6, 3); ctx.fill();
  }
  for (x = PEN_X0; x <= PEN_X1; x += step){ post(x, 44); post(x, WORLD_H - 44); }
  for (y = 44 + step; y <= WORLD_H - 44 - step; y += step){ post(PEN_X0, y); }
  ctx.restore();
}

function drawBiomeGround(i, vb){
  var b = BIOMES[i];
  var g = ctx.createLinearGradient(0, 0, 0, WORLD_H);
  g.addColorStop(0, b.top);
  g.addColorStop(1, b.bot);
  ctx.fillStyle = g;
  ctx.fillRect(b.x0, 0, b.w, WORLD_H);

  if (i === 1){
    /* lake water shimmer */
    ctx.strokeStyle = 'rgba(190,245,255,.12)';
    ctx.lineWidth = 3;
    for (var k = 0; k < 9; k++){
      var yy = 70 + k * 120 + Math.sin(G.t * 0.9 + k) * 8;
      ctx.beginPath();
      for (var x = b.x0; x < b.x1; x += 40){
        var y2 = yy + Math.sin((x + G.t * 40) * 0.012 + k) * 6;
        if (x === b.x0) ctx.moveTo(x, y2); else ctx.lineTo(x, y2);
      }
      ctx.stroke();
    }
  } else if (i === 3){
    /* lava glow */
    var lg = ctx.createRadialGradient(b.x0 + b.w * 0.5, WORLD_H * 0.55, 60, b.x0 + b.w * 0.5, WORLD_H * 0.55, b.w * 0.8);
    lg.addColorStop(0, 'rgba(255,90,30,.22)');
    lg.addColorStop(1, 'rgba(255,90,30,0)');
    ctx.fillStyle = lg;
    ctx.fillRect(b.x0, 0, b.w, WORLD_H);
  } else if (i === 4){
    /* nebula */
    var nb = ctx.createRadialGradient(b.x0 + b.w * 0.35, WORLD_H * 0.3, 20, b.x0 + b.w * 0.35, WORLD_H * 0.3, 420);
    nb.addColorStop(0, 'rgba(160,107,255,.22)');
    nb.addColorStop(1, 'rgba(160,107,255,0)');
    ctx.fillStyle = nb;
    ctx.fillRect(b.x0, 0, b.w, WORLD_H);
    var nb2 = ctx.createRadialGradient(b.x0 + b.w * 0.75, WORLD_H * 0.75, 20, b.x0 + b.w * 0.75, WORLD_H * 0.75, 360);
    nb2.addColorStop(0, 'rgba(80,200,255,.16)');
    nb2.addColorStop(1, 'rgba(80,200,255,0)');
    ctx.fillStyle = nb2;
    ctx.fillRect(b.x0, 0, b.w, WORLD_H);

  /* biome label */
  var cx = b.x0 + b.w / 2;
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,.10)';
  ctx.font = '900 34px -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif';

      ctx.lineTo(x + 6 * s, y + 4 * s);
      ctx.lineTo(x + 26 * s, y - 6 * s);

      ctx.fillStyle = '#453039';
      ell(x - 3 * s, y - 2 * s, 8 * s, 5 * s, d.rot); ctx.fill();

      ell(x, y, 34 * s, 21 * s); ctx.fill();
      ctx.fillStyle = 'rgba(255,120,30,' + (lp * 0.9) + ')';
      ell(x, y, 22 * s, 13 * s); ctx.fill();
      ctx.fillStyle = 'rgba(255,215,110,' + lp + ')';
      ell(x - 2 * s, y - 2 * s, 12 * s, 7 * s); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,220,' + (lp * 0.8) + ')';
      ell(x - 3 * s, y - 3 * s, 5 * s, 3 * s); ctx.fill();
    }
  } else {
    if (d.t < 0.62){
      var tw = 0.35 + 0.55 * Math.abs(Math.sin(G.t * 1.7 + d.ph));
      ctx.fillStyle = 'rgba(255,255,255,' + tw + ')';
      circle(x, y, 1.8 * s + 0.6); ctx.fill();
    } else if (d.t < 0.86){
      ctx.fillStyle = 'rgba(160,107,255,.30)';
      ctx.save();
      ctx.translate(x, y + Math.sin(G.t * 1.2 + d.ph) * 4);
      ctx.rotate(d.rot);
      ctx.beginPath();
      ctx.moveTo(0, -13 * s); ctx.lineTo(8 * s, 0); ctx.lineTo(0, 13 * s); ctx.lineTo(-8 * s, 0);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    } else {
      ctx.fillStyle = 'rgba(120,220,255,.18)';
      ell(x, y, 26 * s, 14 * s, d.rot); ctx.fill();
    }
  }
}

function drawNest(n){
  var b = BIOMES[n.b];
  ctx.save();
  ctx.translate(n.x, n.y);

  /* ground patch */
  ctx.fillStyle = 'rgba(0,0,0,.18)';
  ell(0, 10, 42, 15); ctx.fill();
  ctx.fillStyle = n.b === 2 ? 'rgba(190,160,105,.55)' : (n.b === 1 ? 'rgba(200,180,130,.5)' : 'rgba(90,66,38,.5)');
  ell(0, 8, 44, 17); ctx.fill();

  /* nest bowl */
  ctx.fillStyle = '#6d4a24';
  ell(0, 0, 34, 18); ctx.fill();
  ctx.fillStyle = '#8f6431';
  ell(0, -2, 31, 15); ctx.fill();
  ctx.fillStyle = '#5a3c1c';
  ell(0, 0, 24, 10); ctx.fill();

  /* straw */
  ctx.strokeStyle = 'rgba(210,170,105,.55)';
  ctx.lineWidth = 2;
  for (var i = 0; i < 7; i++){
    var a0 = i * 0.9 + n.ph;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a0) * 20, Math.sin(a0) * 9);
    ctx.lineTo(Math.cos(a0) * 33, Math.sin(a0) * 15);
    ctx.stroke();
  }

  if (n.occ){
    var pop = easeOut(clamp(n.pop, 0, 1));
    var bobY = Math.sin(G.t * 2.2 + n.ph) * 2.4;
    var rr2 = RAR[n.r];
    ctx.save();
    ctx.translate(0, -14 + bobY - (1 - pop) * 16);
    ctx.scale(pop, pop);
    ctx.rotate(Math.sin(G.t * 1.5 + n.ph) * 0.07);

    ctx.shadowColor = rgba(rr2.rgb, 0.85);
    ctx.shadowBlur = 9 + n.r * 4 + (n.r === 6 ? 16 : 0);
    var gradient = ctx.createRadialGradient(-5, -8, 2, 0, 0, 22);
    gradient.addColorStop(0, '#ffffff');
    gradient.addColorStop(0.45, rgba(rr2.rgb, 1));
    gradient.addColorStop(1, rr2.dark);
    ctx.fillStyle = gradient;
    ell(0, 0, 14, 18); ctx.fill();
    ctx.shadowBlur = 0;

    /* pattern spots */
    ctx.fillStyle = rgba([255, 255, 255], 0.55);
    circle(-4, 2, 2.4); ctx.fill();
    circle(5, 6, 1.9); ctx.fill();
    circle(2, -7, 2.1); ctx.fill();
    ctx.fillStyle = rgba([255, 255, 255], 0.8);
    ell(-5, -9, 3.6, 5, -0.4); ctx.fill();

    if (n.m){
      var mc = MUT[n.m].rgb;
      ctx.strokeStyle = rgba(mc, 0.85);
      ctx.lineWidth = 2.4;
      ctx.setLineDash([5, 5]);
      ctx.lineDashOffset = -G.t * 22;
      ctx.beginPath();
      ctx.ellipse(0, 0, 22, 26, 0, 0, TAU);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = rgba(mc, 0.95);
      ctx.font = '900 14px -apple-system,sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(MUT[n.m].emo, 0, -24);
      ctx.textAlign = 'left';
    }

    if (n.r === 6){
      /* 무지개 오라 */
      for (var aq = 0; aq < 3; aq++){
        ctx.strokeStyle = 'hsla(' + ((G.t * 70 + aq * 120) % 360) + ',100%,72%,.55)';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.ellipse(0, 0, 24 + aq * 6 + Math.sin(G.t * 2 + aq) * 2, 29 + aq * 7, 0, 0, TAU);
        ctx.stroke();
      }
      ctx.textAlign = 'center';
      for (var st2 = 0; st2 < 4; st2++){
        var sa2 = G.t * 1.5 + st2 * TAU / 4;
        ctx.fillStyle = 'rgba(255,255,220,' + (0.55 + 0.45 * Math.sin(G.t * 4 + st2)) + ')';
        ctx.font = '900 10px -apple-system,sans-serif';
        ctx.fillText('✦', Math.cos(sa2) * 31, Math.sin(sa2) * 37);
      }
      ctx.textAlign = 'left';
    }
    ctx.restore();

    /* rarity label */
    label(rr2.n, 0, 36, 12.5, rgba(rr2.rgb, 1));
    if (n.nm) label(n.nm, 0, 54, 11.5, '#ffeaa0');
  } else {
    /* empty + timer */
    var left = Math.max(0, n.respawn);
    ctx.strokeStyle = 'rgba(255,255,255,.18)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, -6, 15, 0, TAU); ctx.stroke();
    ctx.strokeStyle = 'rgba(180,220,255,.7)';
    var prog = 1 - clamp(left / 26, 0, 1);
    ctx.beginPath();
    ctx.arc(0, -6, 15, -Math.PI / 2, -Math.PI / 2 + TAU * prog);
    ctx.stroke();
    ctx.fillStyle = 'rgba(200,220,255,.6)';
    ctx.font = '900 11px -apple-system,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(Math.ceil(left) + 's', 0, -2);
    ctx.textAlign = 'left';
  }
  ctx.restore();

  /* prompt */
  var p = G.player;
  if (!p.carry && p.state !== 'steal' && dst(p.x, p.y, n.x, n.y) < 74 && n.occ){
    ctx.save();
    ctx.globalAlpha = 0.85 + 0.15 * Math.sin(G.t * 6);
    ctx.fillStyle = 'rgba(8,12,20,.8)';
    rr(n.x - 34, n.y - 74, 68, 24, 12); ctx.fill();
    ctx.strokeStyle = 'rgba(255,211,94,.75)';
    ctx.lineWidth = 1.5;
    rr(n.x - 34, n.y - 74, 68, 24, 12); ctx.stroke();
    ctx.fillStyle = '#ffe9a8';
    ctx.font = '900 12px -apple-system,"Apple SD Gothic Neo",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('🥚 훔치기', n.x, n.y - 58);
    ctx.textAlign = 'left';
    ctx.restore();
  }
}
