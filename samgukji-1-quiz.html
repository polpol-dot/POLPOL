<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#140d0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="고정욱 삼국지 1 《일어서는 영웅들》 1장~7장(150쪽까지) 이야기 이해 15문제 퀴즈">
<title>삼국지 1 · 일어서는 영웅들 — 퀴즈 (15문제)</title>
<style>
  :root{
    --lacquer:#140d0c; --lacquer-2:#1c1210; --lacquer-3:#251814;
    --paper:#fcf6e8; --paper-2:#f7ecd7; --paper-edge:#e2cda8;
    --seal:#a93226; --seal-2:#c2482f; --seal-deep:#7c1f16;
    --gold:#c8a05a; --gold-light:#ecd6a2; --gold-deep:#8f6a2a;
    --ink:#2a1e17; --ink-2:#6d5844; --ink-3:#937c62;
    --jade:#2e7a5c; --jade-bg:#eaf5ee; --red:#a83226; --red-bg:#fbeae5;
    --radius:18px;
    --serif:"AppleMyungjo","Nanum Myeongjo","Noto Serif KR","Batang","Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0; color:var(--ink); font-family:var(--sans);
    font-size:16px; line-height:1.55; background:var(--lacquer);
    padding-bottom:calc(96px + env(safe-area-inset-bottom));
    -webkit-tap-highlight-color:transparent; overflow-x:hidden;
  }
  /* 먹빛 밤하늘에 흩날리는 금가루 */
  body::before{
    content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(1.5px 1.5px at 12% 9%, rgba(236,214,162,.55), transparent 60%),
      radial-gradient(1.1px 1.1px at 28% 22%, rgba(236,214,162,.40), transparent 60%),
      radial-gradient(1.3px 1.3px at 44% 13%, rgba(255,240,205,.35), transparent 60%),
      radial-gradient(1.7px 1.7px at 64% 8%, rgba(236,214,162,.45), transparent 60%),
      radial-gradient(1.1px 1.1px at 82% 18%, rgba(255,240,205,.35), transparent 60%),
      radial-gradient(1.4px 1.4px at 94% 33%, rgba(236,214,162,.30), transparent 60%),
      radial-gradient(1.2px 1.2px at 7% 44%, rgba(236,214,162,.28), transparent 60%),
      radial-gradient(1.6px 1.6px at 71% 52%, rgba(255,240,205,.26), transparent 60%),
      radial-gradient(1.2px 1.2px at 22% 66%, rgba(236,214,162,.24), transparent 60%),
      radial-gradient(1.5px 1.5px at 88% 74%, rgba(236,214,162,.26), transparent 60%),
      radial-gradient(1.1px 1.1px at 48% 86%, rgba(255,240,205,.22), transparent 60%),
      radial-gradient(120% 72% at 50% -8%, rgba(168,54,38,.30), transparent 62%),
      radial-gradient(70% 40% at 100% 26%, rgba(200,160,90,.10), transparent 72%),
      linear-gradient(180deg,#1b100e 0%, #150d0c 42%, #100a09 100%);
  }

  /* ---------- 히어로 ---------- */
  .hero{
    position:relative; z-index:1; overflow:hidden;
    display:flex; align-items:flex-end; justify-content:center;
    min-height:clamp(350px, 56vh, 480px);
    padding:calc(32px + env(safe-area-inset-top)) 20px 26px;
    text-align:center; color:#fff8ea; background:#0d0807;
  }
  .hero-art{
    position:absolute; inset:-1px;
    background-repeat:no-repeat; background-size:cover; background-position:50% 24%;
  }
  .hero-veil{
    position:absolute; inset:0; pointer-events:none;
    background:
      linear-gradient(180deg, rgba(13,8,7,.52) 0%, rgba(13,8,7,.06) 24%, rgba(13,8,7,.12) 44%, rgba(19,11,9,.80) 78%, var(--lacquer) 100%),
      radial-gradient(70% 46% at 50% 106%, rgba(200,160,90,.26), transparent 72%);
  }
  .hero-copy{position:relative; z-index:2; max-width:640px;}
  .kicker{
    display:inline-block; margin:0; padding:5px 13px; border-radius:99px;
    font-size:10px; font-weight:800; letter-spacing:.14em;
    color:#f6e0b4; background:rgba(20,13,12,.42); border:1px solid rgba(200,160,90,.55);
    backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
  }
  h1{margin:13px 0 0; font-family:var(--serif); font-weight:700; letter-spacing:-.01em; color:#fffdf4;
    text-shadow:0 6px 26px rgba(0,0,0,.7), 0 1px 0 rgba(0,0,0,.45);}
  .h1-main{display:block; font-size:clamp(42px,11.5vw,62px); line-height:1.02;}
  .h1-sub{display:block; margin-top:7px; font-size:clamp(15px,4.4vw,21px); letter-spacing:.14em; color:#f2d9a9;}
  .hero-sub{margin:9px 0 0; font-size:12.5px; font-weight:700; color:#e6d0a7; letter-spacing:.03em;}
  .hero-rule{display:block; width:74px; height:1px; margin:14px auto 0;
    background:linear-gradient(90deg, transparent, rgba(200,160,90,.95), transparent);}

  /* ---------- 진행 바 ---------- */
  .sticky{
    position:sticky; top:0; z-index:30;
    background:rgba(16,10,9,.92);
    backdrop-filter:blur(14px) saturate(120%); -webkit-backdrop-filter:blur(14px) saturate(120%);
    border-bottom:1px solid rgba(200,160,90,.18);
    box-shadow:0 8px 22px rgba(0,0,0,.4);
  }
  .sticky-inner{max-width:720px; margin:0 auto; padding:10px 16px 9px; display:flex; align-items:center; gap:11px;}
  .prog-text{font-size:11.5px; font-weight:800; color:#f1dcb0; white-space:nowrap;}
  .track{flex:1 1 auto; height:6px; border-radius:99px; background:rgba(255,255,255,.12); overflow:hidden;}
  .fill{height:100%; width:0%; border-radius:99px;
    background:linear-gradient(90deg,var(--seal),#e39a55); transition:width .25s ease;}
  .prog-note{font-size:10.5px; font-weight:700; color:rgba(240,220,180,.55); white-space:nowrap;}

  /* ---------- 본문 ---------- */
  main{position:relative; z-index:1; max-width:720px; margin:0 auto; padding:16px 16px 6px;}
  .intro{display:flex; gap:8px; align-items:flex-start; margin:2px 2px 15px;
    font-size:12.5px; line-height:1.65; color:#c8b79c;}
  .intro .dot{flex:0 0 auto; margin-top:3px; width:9px; height:9px; border-radius:3px;
    background:linear-gradient(150deg,var(--seal-2),var(--seal-deep)); border:1px solid rgba(255,220,180,.35);}
  .intro b{color:#f3d79b; font-weight:800;}

  /* ---------- 결과 ---------- */
  .result{
    display:none; position:relative; overflow:hidden;
    margin:0 0 16px; padding:22px 18px 20px; border-radius:20px; text-align:center;
    color:#f8ebd0;
    background:
      radial-gradient(120% 100% at 50% 0%, rgba(200,160,90,.22), transparent 62%),
      linear-gradient(170deg,#251813,#170f0d 58%,#120b0a);
    border:1px solid rgba(200,160,90,.42);
    box-shadow:0 18px 36px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
    scroll-margin-top:80px;
  }
  .result.show{display:block; animation:rise .34s ease both;}
  @keyframes rise{from{opacity:0; transform:translateY(12px) scale(.99);} to{opacity:1; transform:none;}}
  .score-line{display:flex; align-items:baseline; justify-content:center; gap:6px;}
  .score-num{font-family:var(--serif); font-size:clamp(50px,15vw,70px); font-weight:700;
    line-height:1; letter-spacing:-.03em; color:#f6d99f;
    text-shadow:0 0 28px rgba(200,160,90,.45);}
  .score-den{font-size:20px; font-weight:800; color:rgba(240,220,180,.72);}
  .score-pct{display:inline-block; margin-top:11px; padding:4px 12px; border-radius:99px;
    font-size:12px; font-weight:700; color:#f7e6c2; background:rgba(255,255,255,.09);
    border:1px solid rgba(200,160,90,.30);}
  .score-msg{margin:12px 0 0; font-size:15.5px; font-weight:800; color:#fff5e0;}
  .chips{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:11px;}
  .chip{font-size:12.5px; font-weight:700; padding:5px 12px; border-radius:99px;
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.10);}
  .chip.ok{color:#c9f2d9; background:rgba(56,150,110,.22); border-color:rgba(80,190,140,.32);}
  .chip.no{color:#f8cfc2; background:rgba(180,70,50,.26); border-color:rgba(210,110,80,.32);}
  .score-note{margin:12px 0 0; font-size:12.5px; line-height:1.6; color:rgba(240,220,180,.66);}

  /* ---------- 문제 카드 ---------- */
  .card{
    position:relative; padding:16px 14px 14px; margin-bottom:14px;
    background:linear-gradient(180deg,var(--paper),var(--paper-2));
    border:1px solid var(--paper-edge); border-radius:var(--radius);
    box-shadow:0 14px 30px rgba(0,0,0,.42), inset 0 1px 0 #fffdf7;
    transition:border-color .2s ease, background .2s ease, box-shadow .2s ease;
  }
  .card::before{
    content:""; position:absolute; left:16px; right:16px; top:0; height:2px;
    border-radius:0 0 3px 3px;
    background:linear-gradient(90deg, transparent, rgba(169,50,38,.45), transparent);
  }
  .card.correct{border-color:#a9d8bd; background:linear-gradient(180deg,#f8fdf9,#edf7f1);}
  .card.wrong{border-color:#eec2b4; background:linear-gradient(180deg,#fffaf8,#fbece6);}

  .q-head{display:flex; align-items:flex-start; gap:11px; margin:0 0 12px;}
  .q-num{
    flex:0 0 auto; width:32px; height:32px; border-radius:9px;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--serif); font-size:13px; font-weight:700; color:#fff4e2;
    background:linear-gradient(155deg,#c2452f,#93271c);
    border:1px solid var(--seal-deep);
    box-shadow:0 3px 8px rgba(124,31,22,.30), inset 0 1px 0 rgba(255,255,255,.25);
  }
  .card.correct .q-num{background:linear-gradient(155deg,#3f9b74,#246a4d); border-color:#1e5b42; color:#f2fff8;}
  .q-body{flex:1 1 auto; min-width:0;}
  .q-text{margin:0; font-size:15.5px; line-height:1.48; font-weight:700; color:var(--ink); word-break:break-word;}

  .options{display:flex; flex-direction:column; gap:8px;}
  .opt{
    display:flex; align-items:center; gap:10px; width:100%; min-height:52px;
    padding:10px 12px; text-align:left; font:inherit; font-size:14.5px; line-height:1.4;
    color:var(--ink); background:#fffdf6; border:1.5px solid #eadcbe; border-radius:12px;
    cursor:pointer; -webkit-appearance:none; appearance:none;
    transition:border-color .15s ease, background .15s ease, box-shadow .15s ease;
  }
  .opt:hover{border-color:#d9bd90; background:#fffaf0;}
  .opt:focus-visible{outline:3px solid rgba(169,50,38,.40); outline-offset:2px;}
  .opt:active{transform:scale(.996);}
  .letter{
    flex:0 0 auto; width:26px; height:26px; border-radius:7px;
    display:flex; align-items:center; justify-content:center;
    font-size:11.5px; font-weight:800; color:#8a6620; text-transform:uppercase;
    background:#f6e7c6; border:1px solid #e3cb98;
  }
  .opt-label{flex:1 1 auto; min-width:0; word-break:break-word;}
  .mark{flex:0 0 auto; font-size:14px; font-weight:800; color:transparent;}

  .opt[aria-pressed="true"]{border-color:#b6432e; background:#fdf1e3; box-shadow:0 0 0 3px rgba(182,67,46,.14);}
  .opt[aria-pressed="true"] .letter{background:linear-gradient(155deg,#c2452f,#93271c); color:#fff7e8; border-color:#8b2419;}
  .opt.correct{border-color:#3f9a6e; background:var(--jade-bg); box-shadow:none;}
  .opt.correct .letter{background:#3f9a6e; color:#fff; border-color:#3f9a6e;}
  .opt.correct .mark{color:var(--jade);}
  .opt.wrong{border-color:#cf6a4f; background:var(--red-bg); box-shadow:none;}
  .opt.wrong .letter{background:#cf6a4f; color:#fff; border-color:#cf6a4f;}
  .opt.wrong .mark{color:var(--red);}
  .card.correct .opt:not(.correct){opacity:.62;}
  .card.wrong .opt:not(.correct):not(.wrong){opacity:.58;}

  .feedback{
    display:none; margin:10px 0 0; padding:10px 12px; border-radius:10px;
    font-size:12.5px; line-height:1.6; color:var(--ink-2);
    background:rgba(120,90,40,.07); border:1px solid rgba(180,140,80,.20);
    white-space:pre-line; word-break:break-word;
  }
  .feedback.show{display:block;}
  .card.correct .feedback{color:#1f6a4a; background:#eaf6ee; border-color:#c7e6d5;}
  .card.wrong .feedback{color:#96402a; background:#fbeae4; border-color:#f0cdc1;}

  /* ---------- 하단 버튼 ---------- */
  .actionbar{
    position:fixed; left:0; right:0; bottom:0; z-index:40;
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    background:rgba(16,10,9,.94);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-top:1px solid rgba(200,160,90,.22);
  }
  .actionbar-inner{max-width:720px; margin:0 auto; display:flex; gap:10px;}
  .btn{
    flex:1 1 auto; min-height:52px; padding:0 14px; border-radius:13px;
    font:inherit; font-size:15.5px; font-weight:800; border:1.5px solid transparent;
    cursor:pointer; -webkit-appearance:none; appearance:none;
    transition:transform .12s ease, background .2s ease, color .2s ease, box-shadow .2s ease;
  }
  .btn:active{transform:scale(.986);}
  .btn:focus-visible{outline:3px solid rgba(200,160,90,.55); outline-offset:2px;}
  .btn-primary{
    flex:1 1 62%; color:#fff6e6;
    background:linear-gradient(150deg,#b8422c,#8b2318);
    border-color:rgba(236,214,162,.35);
    box-shadow:0 10px 22px rgba(120,30,20,.4), inset 0 1px 0 rgba(255,255,255,.18);
  }
  .btn-primary:disabled{background:rgba(255,255,255,.09); color:rgba(240,220,180,.42); border-color:transparent; box-shadow:none; cursor:default;}
  .btn-ghost{flex:0 0 34%; color:#f1dcb0; background:rgba(255,255,255,.06); border-color:rgba(200,160,90,.36);}

  .toast{
    position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom)); z-index:50;
    transform:translate(-50%,10px); opacity:0; pointer-events:none;
    padding:10px 16px; border-radius:99px; white-space:nowrap;
    font-size:13px; font-weight:700; color:#211609; background:#f2d9a6;
    box-shadow:0 10px 24px rgba(0,0,0,.45);
    transition:opacity .2s ease, transform .2s ease;
    max-width:calc(100vw - 32px); overflow:hidden; text-overflow:ellipsis;
  }
  .toast.show{opacity:1; transform:translate(-50%,0);}

  footer{
    position:relative; z-index:1;
    max-width:720px; margin:0 auto; padding:8px 20px 24px;
    text-align:center; font-size:11.5px; line-height:1.75; color:rgba(240,220,180,.42);
  }
  footer b{color:rgba(240,220,180,.66); font-weight:700;}

  @media (min-width:600px){
    main{padding:20px 20px 6px;}
    .card{padding:19px 20px 17px; margin-bottom:15px;}
    .q-text{font-size:17px;}
    .opt{font-size:15px; min-height:54px; padding:10px 13px;}
    .letter{width:28px; height:28px;}
    .q-num{width:34px; height:34px; font-size:13.5px;}
  }
  /* 넓은 화면: 세로 일러스트를 잘리지 않게 가운데 두고 양옆은 먹빛으로 이어 준다. */
  @media (min-width:760px){
    .hero{min-height:clamp(520px, 72vh, 620px);}
    .hero-art{
      left:50%; right:auto; width:min(100%,680px); transform:translateX(-50%);
      background-size:contain; background-position:50% 50%;
      -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 12%,#000 88%,transparent 100%);
      mask-image:linear-gradient(90deg,transparent 0%,#000 12%,#000 88%,transparent 100%);
    }
    .hero-veil{
      background:
        linear-gradient(90deg, var(--lacquer) 0%, rgba(20,13,12,.55) 12%, rgba(20,13,12,0) 24%,
                        rgba(20,13,12,0) 76%, rgba(20,13,12,.55) 88%, var(--lacquer) 100%),
        linear-gradient(180deg, rgba(13,8,7,.55) 0%, rgba(13,8,7,.04) 24%, rgba(13,8,7,.10) 42%,
                        rgba(19,11,9,.86) 76%, var(--lacquer) 100%),
        radial-gradient(60% 42% at 50% 106%, rgba(200,160,90,.24), transparent 72%);
    }
    .hero-copy{max-width:700px;}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important; transition:none !important;}
  }
</style>
</head>

  /* 정답과 해설은 화면에 그대로 두지 않고, 채점할 때만 풀어서 쓴다. */
  var KEY_B64 = "YWFjYWNjYmNiYWJiY2Fi";

  var TOTAL = QUESTIONS.length;
  var LETTERS = ["a", "b", "c"];

  var answers = new Array(TOTAL);
  for (var ai = 0; ai < TOTAL; ai++) { answers[ai] = null; }
  var graded = false;
  var lastScore = 0;

  var cards = [];
  var optionEls = [];
  var feedbackEls = [];
  var els = {};

  /* ================= 인코딩된 키·해설 풀기 ================= */
  function b64Bytes(str) {
    var table = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";
    var src = String(str).replace(/[^A-Za-z0-9+\/]/g, "");
    var bytes = [], bits = 0, buf = 0;
    for (var i = 0; i < src.length; i++) {
      var v = table.indexOf(src.charAt(i));
      if (v < 0) { continue; }
      buf = (buf << 6) | v;
      bits += 6;
      if (bits >= 8) {
        bits -= 8;
        bytes.push((buf >> bits) & 255);
      }
    }
    return bytes;
  }

  function utf8Text(bytes) {
    var out = "", i = 0;
    while (i < bytes.length) {
      var b = bytes[i++];
      if (b < 0x80) {
        out += String.fromCharCode(b);
      } else if (b < 0xE0) {
        out += String.fromCharCode(((b & 31) << 6) | (bytes[i++] & 63));
      } else if (b < 0xF0) {
        out += String.fromCharCode(((b & 15) << 12) | ((bytes[i++] & 63) << 6) | (bytes[i++] & 63));
      } else {
        var cp = ((b & 7) << 18) | ((bytes[i++] & 63) << 12) | ((bytes[i++] & 63) << 6) | (bytes[i++] & 63);
        cp -= 0x10000;
        out += String.fromCharCode(0xD800 + (cp >> 10), 0xDC00 + (cp & 1023));
      }
    }
    return out;
  }

  function decodeKey() {
    var text = utf8Text(b64Bytes(KEY_B64));
    var key = [];
    for (var i = 0; i < text.length; i++) {
      key.push(LETTERS.indexOf(text.charAt(i)));
    }
    return key;
  }

  function decodeExpl() {
    try {
      var list = JSON.parse(utf8Text(b64Bytes(EXPL_B64)));
      return (list && list.length === TOTAL) ? list : [];
    } catch (e) { return []; }
  }

  /* ================= 화면 만들기 ================= */
  function makeEl(tag, className, text) {
    var el = document.createElement(tag);
    if (className) { el.className = className; }
    if (text !== undefined && text !== null) { el.textContent = text; }
    return el;
  }

  function pad2(n) {
    return n < 10 ? "0" + n : String(n);
  }

  function buildCard(item, index) {
    var card = makeEl("section", "card");
    card.setAttribute("data-q", String(index));

    var head = makeEl("div", "q-head");
    var num = makeEl("span", "q-num", pad2(index + 1));
    num.setAttribute("aria-hidden", "true");

    var body = makeEl("div", "q-body");
    var text = makeEl("h2", "q-text", item.q);
    body.appendChild(text);

    head.appendChild(num);
    head.appendChild(body);

    var list = makeEl("div", "options");
    list.setAttribute("role", "group");
    list.setAttribute("aria-label", "문제 " + (index + 1) + " 보기");

    var buttons = [];
    for (var oi = 0; oi < item.opts.length; oi++) {
      (function (qIndex, optIndex) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "opt";
        btn.setAttribute("aria-pressed", "false");
        btn.setAttribute("data-opt", String(optIndex));
        btn.appendChild(makeEl("span", "letter", LETTERS[optIndex]));
        btn.appendChild(makeEl("span", "opt-label", item.opts[optIndex]));
        btn.appendChild(makeEl("span", "mark", ""));

        btn.addEventListener("click", function () {
          chooseOption(qIndex, optIndex);
        });
        list.appendChild(btn);
        buttons.push(btn);
      })(index, oi);
    }

    var fb = makeEl("p", "feedback", "");
    fb.setAttribute("aria-live", "polite");

    card.appendChild(head);
    card.appendChild(list);
    card.appendChild(fb);

    cards[index] = card;
    optionEls[index] = buttons;
    feedbackEls[index] = fb;
    return card;
  }

  function render() {
    var quiz = document.getElementById("quiz");
    for (var i = 0; i < TOTAL; i++) {
      quiz.appendChild(buildCard(QUESTIONS[i], i));
    }
  }

  function answeredCount() {
    var n = 0;
    for (var i = 0; i < TOTAL; i++) {
      if (answers[i] !== null) { n++; }
    }
    return n;
  }

  function updateProgress() {
    var n = answeredCount();
    if (graded) {
      els.progressText.textContent = "채점 완료 · " + lastScore + " / " + TOTAL;
      els.progNote.textContent = "결과 보기";
    } else {
      els.progressText.textContent = n + " / " + TOTAL + " 답함";
      els.progNote.textContent = n === TOTAL ? "다 풀었어요" : "채점 전";
    }
    els.progressFill.style.width = (n / TOTAL * 100) + "%";
    if (els.progressBar && els.progressBar.setAttribute) {
      els.progressBar.setAttribute("aria-valuenow", String(n));
    }
  }

  function chooseOption(qIndex, optIndex) {
    if (graded) { return; }
    answers[qIndex] = optIndex;
    var buttons = optionEls[qIndex];
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].setAttribute("aria-pressed", i === optIndex ? "true" : "false");
    }
    updateProgress();
  }

  function messageFor(pct, correct) {
    if (correct === TOTAL) { return "완벽해요! 도원결의 삼형제처럼 든든한 실력이에요 ⚔️"; }
    if (pct >= 90) { return "정말 잘했어요! 거의 다 맞혔어요 🌸"; }
    if (pct >= 75) { return "좋아요! 조금만 더 하면 완벽해요 ✨"; }
    if (pct >= 50) { return "괜찮아요! 책을 한 번 더 펼쳐 볼까요? 📖"; }
    return "다시 읽으면서 천천히 풀어 봐요 🌙";
  }

  function answerLabel(qIndex, optIndex) {
    if (optIndex === null) { return "선택 안 함"; }
    return LETTERS[optIndex] + ") " + QUESTIONS[qIndex].opts[optIndex];
  }

  function showResult(correct, answered) {
    var pct = Math.round(correct / TOTAL * 100);
    if (!els.result) { return; }
    els.scoreNum.textContent = String(correct);
    els.scoreDen.textContent = "/ " + TOTAL;
    els.scorePct.textContent = "정답률 " + pct + "%";
    els.scoreMsg.textContent = messageFor(pct, correct);
    els.chipOk.textContent = "정답 " + correct;
    els.chipNo.textContent = "오답 " + (TOTAL - correct);

    var blank = TOTAL - answered;
    if (correct === TOTAL) {
      els.scoreNote.textContent = TOTAL + "문제를 모두 맞혔어요! 다음 장에서 만나요.";
    } else if (blank > 0) {
      els.scoreNote.textContent = "선택하지 않은 " + blank + "문제는 오답으로 처리했어요. 다시 풀기로 새로 시작할 수 있어요.";
    } else {
      els.scoreNote.textContent = "틀린 문제는 카드에서 내 답과 정답, 해설을 함께 확인해 보세요.";
    }

    els.result.classList.add("show");
    els.checkBtn.disabled = true;
    els.checkBtn.textContent = "채점 완료";
    updateProgress();

    if (els.result.scrollIntoView) {
      els.result.scrollIntoView({ behavior: "smooth", block: "start" });
    }
  }

  function grade() {
    if (graded) { return; }
    var answered = answeredCount();
    if (answered === 0) {
      toast("먼저 보기를 하나 골라 주세요");
      return;
    }

    graded = true;
    var key = decodeKey();
    var expl = decodeExpl();
    var correct = 0;

    for (var i = 0; i < TOTAL; i++) {
      var isRight = answers[i] === key[i];
      var card = cards[i];
      if (isRight) { correct++; }
      card.className = "card " + (isRight ? "correct" : "wrong");

      var buttons = optionEls[i];
      for (var j = 0; j < buttons.length; j++) {
        var btn = buttons[j];
        btn.setAttribute("aria-disabled", "true");
        if (j === key[i]) {
          btn.className = "opt correct";
          btn.setAttribute("aria-pressed", answers[i] === j ? "true" : "false");
          btn.lastChild.textContent = "✓";
        } else if (j === answers[i]) {
          btn.className = "opt wrong";
          btn.setAttribute("aria-pressed", "true");
          btn.lastChild.textContent = "✕";
        } else {
          btn.className = "opt";
          btn.setAttribute("aria-pressed", "false");
          btn.lastChild.textContent = "";
        }
      }

      var fb = feedbackEls[i];
      var head = isRight
        ? "정답이에요!"
        : "내 답: " + answerLabel(i, answers[i]) + "\n정답: " + answerLabel(i, key[i]);
      var note = expl[i] ? "\n" + expl[i] : "";
      fb.textContent = head + note;
      fb.classList.add("show");
    }

    lastScore = correct;
    showResult(correct, answered);
  }

  function resetQuiz() {
    graded = false;
    lastScore = 0;
    for (var i = 0; i < TOTAL; i++) {
      answers[i] = null;
      cards[i].className = "card";
      var fb = feedbackEls[i];
      fb.textContent = "";
      fb.classList.remove("show");
      var buttons = optionEls[i];
      for (var j = 0; j < buttons.length; j++) {
        buttons[j].className = "opt";
        buttons[j].setAttribute("aria-pressed", "false");
        buttons[j].setAttribute("aria-disabled", "false");
        buttons[j].lastChild.textContent = "";
      }
    }
    els.result.classList.remove("show");
    els.checkBtn.disabled = false;
    els.checkBtn.textContent = "채점하기 · Check";
    updateProgress();
    if (els.top && els.top.scrollIntoView) {
      els.top.scrollIntoView({ behavior: "smooth", block: "start" });
    }
  }

  var toastTimer = null;
  function toast(message) {
    if (!els.toast) { return; }
    els.toast.textContent = message;
    els.toast.classList.add("show");
    if (typeof setTimeout === "function") {
      if (toastTimer) { clearTimeout(toastTimer); }
      toastTimer = setTimeout(function () {
        els.toast.classList.remove("show");
      }, 2200);
    }
  }

  function init() {
    els.progressText = document.getElementById("progressText");
    els.progressFill = document.getElementById("progressFill");
    els.progressBar = document.getElementById("progressBar");
    els.progNote = document.getElementById("progNote");
    els.result = document.getElementById("result");
    els.scoreNum = document.getElementById("scoreNum");
    els.scoreDen = document.getElementById("scoreDen");
    els.scorePct = document.getElementById("scorePct");
    els.scoreMsg = document.getElementById("scoreMsg");
    els.chipOk = document.getElementById("chipOk");
    els.chipNo = document.getElementById("chipNo");
    els.scoreNote = document.getElementById("scoreNote");
    els.checkBtn = document.getElementById("checkBtn");
    els.resetBtn = document.getElementById("resetBtn");
    els.toast = document.getElementById("toast");
    els.top = document.getElementById("top");

    render();
    updateProgress();

    els.checkBtn.addEventListener("click", grade);
    els.resetBtn.addEventListener("click", resetQuiz);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
